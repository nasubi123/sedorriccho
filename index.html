function vCal(D){
  const {y,m,show}=S.cal,first=new Date(y,m,1),nd=new Date(y,m+1,0).getDate(),off=first.getDay();
  const key=`${y}-${String(m+1).padStart(2,"0")}`;
  const E=events(D),by={};E.forEach(e=>{(by[e.date]=by[e.date]||[]).push(e)});
  const M=monthStats(D,key);
  const sellDays=new Set(E.filter(e=>e.type==="sell"&&ym(e.date)===key).map(e=>e.date)).size;
  let cells="";
  for(let k=0;k<off;k++)cells+=`<div class="day pad"></div>`;
  for(let d=1;d<=nd;d++){
    const ds=`${key}-${String(d).padStart(2,"0")}`,wd=(off+d-1)%7,ev=by[ds]||[];
    const bs=ev.filter(e=>e.type==="buy"),ss=ev.filter(e=>e.type==="sell"),xs=ev.filter(e=>e.type==="exp");
    const b=bs.reduce((a,e)=>a+e.amount,0),s=ss.reduce((a,e)=>a+e.amount,0);
    const showB=show!=="sell"&&bs.length,showS=show!=="buy"&&ss.length;
    cells+=`<div class="day ${wd===0?"sun":wd===6?"sat":""} ${ds===TD?"today":""} ${ds===S.cal.sel?"sel":""} ${showS?"has-sell":""}" role="button" tabindex="0" data-day="${ds}" aria-label="${jdate(ds)}"><span class="d">${d}</span>${showS?`<span class="mk sell">${short(s)}</span>`:""}${showB?`<span class="mk buy">${b?short(b):"仕入"}</span>`:""}${xs.length&&show==="all"?`<span class="ex"></span>`:""}</div>`;
  }
  const sel=S.cal.sel,list=(by[sel]||[]).filter(e=>show==="all"||e.type===show);
  const ds=list.reduce((a,e)=>a+(e.type==="sell"?e.profit||0:0),0);
  return `<section class="card">
    <div class="calhead"><button class="nav" type="button" data-cal="-1" aria-label="前の月">${I(IC.l,2.2)}</button><h2>${y}年${m+1}月</h2>${key!==CUR?`<button class="today" type="button" data-cal="0">今月</button>`:""}<button class="nav" type="button" data-cal="1" aria-label="次の月">${I(IC.r,2.2)}</button></div>
    <div class="ctiles"><div class="ctile sell"><span>売上</span><b>${yen(M.sales)}</b></div><div class="ctile buy"><span>仕入</span><b>${yen(M.buy)}</b></div><div class="ctile pf"><span>利益</span><b class="${pm(M.net)}">${sYen(M.net)}</b></div></div>
    <div class="seg" style="margin-top:12px"><button type="button" data-calshow="all" aria-pressed="${show==="all"}">すべて</button><button type="button" data-calshow="sell" aria-pressed="${show==="sell"}">売れた日</button><button type="button" data-calshow="buy" aria-pressed="${show==="buy"}">仕入れた日</button></div>
    <div class="grid7">${WD.map((w,k)=>`<div class="dow ${k===0?"sun":k===6?"sat":""}">${w}</div>`).join("")}${cells}</div>
    <p class="note" style="margin-top:10px">${sellDays?`今月は${sellDays}日売れています`:"今月はまだ売れた日がありません"}</p>
  </section>
  ${cardHead("day",jdate(sel),ds?`<span class="note">利益 <b class="n ${pm(ds)}">${sYen(ds)}</b></span>`:"")}${list.length?`<div class="rows">${list.map(eventRow).join("")}</div>`:`<p class="note" style="padding:8px 0">この日の記録はありません</p>`}
  ${S.canWrite?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" type="button" data-act="new-item-day">この日に仕入れた商品</button><button class="btn sm" type="button" data-act="new-exp-day">この日の経費</button></div>`:""}</section>`;
}

function vStats(D){
  const seg=S.st.seg;
  const segs=`<div class="seg"><button type="button" data-seg="year" aria-pressed="${seg==="year"}">年間</button><button type="button" data-seg="cat" aria-pressed="${seg==="cat"}">カテゴリー</button><button type="button" data-seg="person" aria-pressed="${seg==="person"}">担当者</button><button type="button" data-seg="card" aria-pressed="${seg==="card"}">カード</button></div>`;
  if(!Object.keys(S.items).length&&!Object.keys(S.titles).length&&!Object.keys(S.exps).length)return segs+empty("chart","集計するデータがありません","","new-item","商品を追加");
  return segs+(seg==="year"?statYear(D):seg==="cat"?statCats(D):statBuy(seg));
}
function statYear(D){
  const ys=new Set([String(T0.getFullYear())]);
  Object.values(S.items).forEach(i=>{[i.pDate,i.sDate].forEach(d=>d&&ys.add(d.slice(0,4)))});Object.values(S.exps).forEach(e=>e.date&&ys.add(e.date.slice(0,4)));
  const years=[...ys].sort().reverse(),y=years.includes(S.st.year)?S.st.year:years[0];
  let sales=0,fees=0,cogs=0,buy=0,exp=0;const rows=[];
  for(let mo=1;mo<=12;mo++){const k=`${y}-${String(mo).padStart(2,"0")}`,M=monthStats(D,k);rows.push([k,M]);buy+=M.buy;exp+=M.exp}
  Object.values(S.items).forEach(i=>{if(SOLD(i.status)&&(i.sDate||"").startsWith(y)){const r=D.R[i.id];sales+=r.sale;fees+=r.fee+r.ship;cogs+=r.alloc}});
  const inc=sales-fees-cogs-exp,line=200000,w=Math.max(0,Math.min(1,inc/line))*100;
  return `<div class="chips"><label class="pick on"><span>${y}年</span><select id="f-year" aria-label="年">${years.map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("")}</select></label></div>
  <section class="card"><div class="ch"><h2>${y}年のまとめ</h2></div>
    <div class="kv"><div><span>売上</span><b>${yen(sales)}</b></div><div><span>手数料・送料</span><b>${yen(fees)}</b></div><div><span>売れた商品の原価</span><b>${yen(cogs)}</b></div><div><span>経費</span><b>${yen(exp)}</b></div><div><span>仕入れた総額</span><b>${yen(buy)}</b></div><div><span>もうけ（所得の目安）</span><b class="${pm(inc)}">${sYen(inc)}</b></div></div>
    <div style="margin-top:14px"><div class="mlab" style="margin:0 0 6px"><span>副業の申告ライン 20万円まで</span><span><b>${inc>=line?"超えています":yen(Math.max(0,line-inc))+" の余裕"}</b></span></div><div class="line200 ${inc>=line?"over":""}"><i style="width:${w}%"></i></div>
    <p class="note" style="margin-top:8px">会社員の副業では、所得が年20万円を超えると確定申告が必要になるのが目安です。20万円以下でも住民税の申告は必要です。売れ残った在庫の扱いなど、詳しくは税務署や税理士に確認してください。</p></div>
  </section>
  <section class="card"><div class="ch"><h2>月別</h2></div><div class="tw"><table><thead><tr><th>月</th><th class="r">売上</th><th class="r">仕入</th><th class="r">経費</th><th class="r">利益</th></tr></thead><tbody>${rows.map(([k,M])=>`<tr><td>${+k.slice(5)}月</td><td class="r">${M.sales?yen(M.sales):`<span class="faint">—</span>`}</td><td class="r">${M.buy?yen(M.buy):`<span class="faint">—</span>`}</td><td class="r">${M.exp?yen(M.exp):`<span class="faint">—</span>`}</td><td class="r ${pm(M.net)}">${M.net?sYen(M.net):`<span class="faint">—</span>`}</td></tr>`).join("")}</tbody></table></div>
  <button class="btn sm" type="button" data-act="export-year" data-y="${y}" style="margin-top:12px">${y}年の明細をCSVに書き出す</button></section>`;
}
function statCats(D){
  const C=cfg(),G={};const z=()=>({n:0,sold:0,cost:0,sales:0,net:0,soldCost:0,profit:0,sd:0,sdn:0});
  const add=(c1,c2,o)=>{c1=c1||"未分類";G[c1]=G[c1]||{t:z(),sub:{}};const s=c2||"";G[c1].sub[s]=G[c1].sub[s]||z();for(const k in o){G[c1].t[k]+=o[k];G[c1].sub[s][k]+=o[k]}};
  Object.values(S.items).forEach(i=>{const r=D.R[i.id],sold=SOLD(i.status);add(i.cat1,i.cat2,{n:1,sold:sold?1:0,cost:r.alloc,sales:r.sale,net:sold?r.net:0,soldCost:sold?r.alloc:0,profit:r.profit||0,sd:r.sellDays!=null?r.sellDays:0,sdn:r.sellDays!=null?1:0})});
  Object.entries(D.unalloc).forEach(([id,v])=>{const t=S.titles[id];add(t.cat1,t.cat2,{cost:v,profit:-v})});
  const keys=Object.keys(G).sort((a,b)=>{const ia=C.cats.indexOf(a),ib=C.cats.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)});
  const mx=Math.max(.01,...keys.map(k=>{const x=G[k].t;return Math.abs(x.sales?x.profit/x.sales:0)}));
  const line=(nm,x,sub)=>`<tr class="${sub?"sub":""}"><td>${sub?esc(nm||"その他"):`<b>${esc(nm)}</b>`}</td><td class="r">${x.sold}/${x.n}</td><td class="r">${yen(x.cost)}</td><td class="r">${yen(x.sales)}</td><td class="r ${pm(x.profit)}">${sYen(x.profit)}</td><td class="r">${pct(x.sales?x.profit/x.sales:null)}</td><td class="r">${pct(x.soldCost?x.net/x.soldCost:null)}</td><td class="r">${x.sdn?Math.round(x.sd/x.sdn)+"日":"—"}</td></tr>`;
  return `<section class="card"><div class="ch"><h2>どれが稼げているか</h2></div><div class="rows">${keys.map(k=>{const x=G[k].t,m=x.sales?x.profit/x.sales:0;return `<div class="row">${thumb("",k)}<div class="main"><div class="t1">${esc(k)}</div><div class="hbar ${m<0?"r":""}"><i style="width:${Math.abs(m)/mx*100}%"></i></div></div><div class="side" style="min-width:86px"><span class="amt">${x.sales?pct(m):"—"}</span><span class="sub ${pm(x.profit)}">${sYen(x.profit)}</span></div></div>`}).join("")}</div></section>
  <section class="card"><div class="ch"><h2>くわしい内訳</h2></div><div class="tw"><table><thead><tr><th>カテゴリー</th><th class="r">販売/点数</th><th class="r">仕入</th><th class="r">売上</th><th class="r">利益</th><th class="r">利益率</th><th class="r">回収率</th><th class="r">売れるまで</th></tr></thead><tbody>${keys.map(k=>{const g=G[k],subs=Object.keys(g.sub);return line(k,g.t)+(subs.length>1||subs[0]?subs.map(s=>line(s,g.sub[s],true)).join(""):"")}).join("")}</tbody></table></div><p class="note" style="margin-top:8px">回収率は、売れた分の手取り ÷ その原価</p></section>`;
}
function statBuy(seg){
  const P=purchases(true);
  if(!P.length)return empty("receipt","仕入れや経費の記録がありません");
  const months=[...new Set(P.map(p=>ym(p.date)||"日付なし"))].sort().reverse();
  const mo=S.st.month&&months.includes(S.st.month)?S.st.month:"";
  const PP=mo?P.filter(p=>(ym(p.date)||"日付なし")===mo):P;
  const tot=PP.reduce((a,b)=>a+b.amount,0),key=seg==="person"?"buyer":"card";
  const g={};PP.forEach(p=>{g[p[key]]=g[p[key]]||{a:0,c:0};g[p[key]].a+=p.amount;g[p[key]].c++});
  let html=`<div class="chips"><label class="pick ${mo?"on":""}"><span>${mo?mlabel(mo):"全期間"}</span><select id="f-month" aria-label="期間"><option value="">全期間</option>${months.map(m=>`<option value="${m}" ${mo===m?"selected":""}>${mlabel(m)}</option>`).join("")}</select></label></div>
  <section class="card"><div class="ch"><h2>${seg==="person"?"誰がいくら払ったか":"カードごとの利用額"}</h2><span class="r amt">${yen(tot)}</span></div><div class="rows">${Object.entries(g).sort((a,b)=>b[1].a-a[1].a).map(([k,v])=>`<div class="row" ${seg==="person"?`role="button" tabindex="0" data-person="${esc(k)}"`:""}><div class="main"><div class="t1">${esc(k)}</div><div class="hbar ${seg==="card"?"o":""}"><i style="width:${tot?v.a/tot*100:0}%"></i></div></div><div class="side" style="min-width:92px"><span class="amt">${yen(v.a)}</span><span class="sub">${v.c}件</span></div>${seg==="person"?`<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l6 6-6 6"/></svg>`:""}</div>`).join("")}</div><p class="note" style="margin-top:8px">仕入れと経費を合わせた金額です</p></section>`;
  if(seg==="card"){
    const cards=[...new Set(P.map(p=>p.card))],mx={};P.forEach(p=>{const m=ym(p.date)||"日付なし";mx[m]=mx[m]||{};mx[m][p.card]=(mx[m][p.card]||0)+p.amount});
    html+=`<section class="card"><div class="ch"><h2>月ごとの利用額</h2><span class="r note">引き落とし確認用</span></div><div class="tw"><table><thead><tr><th>月</th>${cards.map(c=>`<th class="r">${esc(c)}</th>`).join("")}<th class="r">合計</th></tr></thead><tbody>${months.map(m=>{const r=mx[m]||{};return `<tr><td>${mlabel(m)}</td>${cards.map(c=>`<td class="r">${r[c]?yen(r[c]):`<span class="faint">—</span>`}</td>`).join("")}<td class="r"><b>${yen(Object.values(r).reduce((a,b)=>a+b,0))}</b></td></tr>`}).join("")}</tbody></table></div></section>`;
  }else{
    const p=S.st.person&&g[S.st.person]?S.st.person:"";
    if(p){const det=PP.filter(x=>x.buyer===p);
      html+=`<section class="card"><div class="ch"><h2>${esc(p)}の立替明細</h2><button class="r link" type="button" data-act="export-person">CSV</button></div><div class="tw"><table><thead><tr><th>日付</th><th>内容</th><th>カード</th><th class="r">金額</th></tr></thead><tbody>${det.map(x=>`<tr><td>${md(x.date)}</td><td style="white-space:normal;min-width:140px">${x.kind==="経費"?`<span class="etag exp">経費</span> `:""}${esc(x.label)}</td><td>${esc(x.card)}</td><td class="r">${yen(x.amount)}</td></tr>`).join("")}<tr class="total"><td colspan="3">合計${mo?"（"+mlabel(mo)+"）":""}</td><td class="r">${yen(det.reduce((a,b)=>a+b.amount,0))}</td></tr></tbody></table></div></section>`}
    else html+=`<p class="note">名前をタップすると、精算用の明細が出ます</p>`;
  }
  return html;
}

const chipVals=(f,name)=>[...f.querySelectorAll(`.cg[data-name="${name}"] [aria-checked="true"]`)].map(b=>b.dataset.v);
function payHTML(C,rec,ro){
  const ps=rec.pays||[],uq=a=>[...new Set(a.filter(Boolean))];
  const cards=uq([rec.card,...ps.map(p=>p.card)]),ppl=uq([rec.buyer,...ps.map(p=>p.buyer)]);
  const m=(name,label,list,sel)=>{const arr=uq(list.concat(sel));return `<div class="cf"><span class="lbl">${label}<small class="multi-h">複数OK</small></span><div class="cg" data-name="${name}" data-multi="1" role="group" aria-label="${label}">${arr.map(v=>`<button type="button" role="checkbox" data-v="${esc(v)}" aria-checked="${sel.includes(v)}" ${ro||""}>${esc(v)}</button>`).join("")}</div></div>`};
  return m("card","支払い方法",C.cards,cards)+m("buyer","払った人",C.people,ppl)+`<div class="split" data-pay></div>`;
}
function payAttach(form,rec,o){
  const el=form.querySelector("[data-pay]");let rows=(rec.pays||[]).map(p=>Object.assign({},p));
  const mode=()=>o.draws&&o.draws()>0?"draws":"amount";
  const layout=()=>{const cards=chipVals(form,"card"),ppl=chipVals(form,"buyer");
    if(cards.length>1)return {cards,ppl,L:cards.map(c=>({card:c,by:"card"}))};
    if(ppl.length>1)return {cards,ppl,L:ppl.map(b=>({card:cards[0]||"",buyer:b,by:"buyer"}))};
    return {cards,ppl,L:[]}};
  const find=l=>l.by==="card"?rows.find(r=>r.card===l.card):rows.find(r=>r.buyer===l.buyer&&(r.card||"")===(l.card||""));
  const ensure=l=>{let r=find(l);if(!r){r={card:l.card,buyer:l.buyer||"",draws:0,amount:null};rows.push(r)}if(l.by==="buyer")r.card=l.card;return r};
  const who=(l,r,ppl)=>l.by==="buyer"?l.buyer:(r&&ppl.includes(r.buyer)?r.buyer:ppl[0]||"");
  const raw=()=>{const {L,ppl}=layout(),md=mode();return L.map(l=>{const r=find(l)||{};return md==="draws"?{card:l.card,buyer:who(l,r,ppl),draws:+r.draws||0}:{card:l.card,buyer:who(l,r,ppl),amount:+r.amount||0}})};
  const used=()=>raw().reduce((a,p)=>a+(mode()==="draws"?p.draws:p.amount),0);
  const tot=()=>mode()==="draws"?o.draws():o.total();
  const restRow=()=>{const R0=raw(),e=R0.filter(p=>!(p.draws||p.amount));return e.length===1&&tot()-used()>0?e[0]:null};
  const value=()=>{const k=mode()==="draws"?"draws":"amount",rr=restRow(),rest=tot()-used();return raw().map(p=>rr&&p.card===rr.card&&p.buyer===rr.buyer?Object.assign({},p,{[k]:rest}):p).filter(p=>(p.draws||p.amount)>0)};
  const summary=()=>{const sm=el.querySelector(".spsum"),bar=el.querySelector(".spbar");if(!sm)return;const md=mode(),tot=md==="draws"?o.draws():o.total(),u=used(),rest=tot-u,f=v=>md==="draws"?v+"回":yen(v);
    const {cards,ppl}=layout(),rr=restRow(),mainL=rr?`${rr.card}${ppl.length>1?"・"+rr.buyer:""}`:`${cards[0]||"未設定"}${ppl.length>1?"・"+(ppl[0]||""):""}`;
    bar.className="spbar "+(rest<0?"over":rest===0&&tot?"ok":"");bar.firstElementChild.style.width=(tot?Math.min(100,u/tot*100):0)+"%";
    const tt=tot;sm.innerHTML=!tt?(md==="draws"?"回数を入れると分けられます":"金額を入れると分けられます"):rest<0?`<b>${f(-rest)}</b>多すぎます（合計${f(tot)}）`:rest===0?`ぴったり <b>${f(tot)}</b>`:`${f(tot)}中 <b>${f(u)}</b>・残り${f(rest)}は「${esc(mainL)}」`;
    if(md==="draws"){const per=o.total()&&o.draws()?o.total()/o.draws():0;el.querySelectorAll(".sprow").forEach(x=>{const r=find(JSON.parse(x.dataset.l));const sm2=x.querySelector(".spc small");if(sm2)sm2.textContent=r&&+r.draws&&per?yen(Math.round(per*r.draws)):""})}};
  const render=()=>{if(!el)return;const {L,ppl}=layout(),md=mode();
    if(!L.length){el.innerHTML="";return}
    el.innerHTML=`<div class="sph"><b>${L[0].by==="card"?"どのカードで、誰が払った？":"誰がいくら払った？"}</b></div><div class="spbar"><i></i></div><div class="spsum"></div>
    <div class="sprows">${L.map(l=>{const r=find(l)||{},w=who(l,r,ppl),lab=l.by==="card"?l.card:l.buyer,h=hueOf(l.by==="card"?l.card:l.buyer);
      return `<div class="sprow ${(md==="draws"?+r.draws:+r.amount)>0?"on":""}" data-l='${esc(JSON.stringify(l))}' style="--h:${h}"><div class="sptop"><span class="spc by-${l.by}"><i></i><span><b>${esc(lab)}</b><small></small></span></span>
      ${md==="draws"?`<span class="stp"><button type="button" data-st="-1" aria-label="減らす">−</button><b>${+r.draws||0}<small>回</small></b><button type="button" data-st="1" aria-label="増やす">＋</button></span>`:`<label class="spamt"><i>¥</i><input type="number" inputmode="numeric" data-amt value="${+r.amount||""}" placeholder="0" aria-label="${esc(lab)}の金額"></label>`}</div>
      ${l.by==="card"&&ppl.length>1?`<div class="spwho">${ppl.map(p=>`<button type="button" data-pw="${esc(p)}" aria-pressed="${p===w}">${esc(p)}</button>`).join("")}</div>`:""}</div>`}).join("")}</div>`;
    summary()};
  el.addEventListener("click",e=>{const row=e.target.closest(".sprow");if(!row)return;const l=JSON.parse(row.dataset.l);
    const st=e.target.closest("[data-st]");if(st){const r=ensure(l),tot=o.draws(),others=raw().reduce((a,p)=>a+(p.card===l.card&&(l.by==="card"||p.buyer===l.buyer)?0:p.draws),0);let v=Math.max(0,(+r.draws||0)+(+st.dataset.st));if(tot)v=Math.min(v,Math.max(0,tot-others));r.draws=v;render();return}
    const pw=e.target.closest("[data-pw]");if(pw){ensure(l).buyer=pw.dataset.pw;render();return}});
  el.addEventListener("input",e=>{const inp=e.target.closest("[data-amt]");if(!inp)return;const row=inp.closest(".sprow"),l=JSON.parse(row.dataset.l);ensure(l).amount=inp.value===""?null:+inp.value;row.classList.toggle("on",+inp.value>0);summary()});
  form.addEventListener("chip",e=>{if(e.detail.name==="card"||e.detail.name==="buyer")render()});
  form.addEventListener("input",e=>{if(!el.contains(e.target))setTimeout(()=>{const md=el.dataset.md;if(md!==mode()){el.dataset.md=mode();render()}else summary()},0)});
  form.addEventListener("change",e=>{if(!el.contains(e.target))setTimeout(render,0)});
  form.addEventListener("click",e=>{if(e.target.closest("[data-draws],[data-unitp],[data-add-amt]"))setTimeout(()=>{el.dataset.md=mode();render()},0)});
  el.dataset.md=mode();render();
  return {
    read(){const {cards,ppl}=layout();return {card:cards[0]||"",buyer:ppl[0]||"",pays:value()}},
    check(){if(!layout().L.length)return "";const md=mode(),tot=md==="draws"?o.draws():o.total();return tot&&used()>tot?(md==="draws"?"分けた回数が合計回数を超えています":"分けた金額が合計を超えています"):""},
    render};
}

const IS_APP=!(window.claude&&window.claude.use);
async function saveFile(name,blob){
  if(downloads){try{await downloads.save({filename:name,data:blob});return true}catch(e){return !!(e&&e.code==="declined")}}
  if(!IS_APP)return false;
  try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return true}}catch(e){if(e&&e.name==="AbortError")return true}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true}catch(e){return false}
}

  if(ds.day){S.cal.sel=ds.day;render();return}
  if(ds.calshow){S.cal.show=ds.calshow;render();return}
  if(ds.cal){const v=+ds.cal;if(v===0){S.cal.y=T0.getFullYear();S.cal.m=T0.getMonth();S.cal.sel=TD}else{const d=new Date(S.cal.y,S.cal.m+v,1);S.cal.y=d.getFullYear();S.cal.m=d.getMonth();const k=`${S.cal.y}-${String(S.cal.m+1).padStart(2,"0")}`;S.cal.sel=k===CUR?TD:k+"-01"}render();return}
  if(ds.delItem||ds.delTitle||ds.delExp){
    if(!ds.armed){ds.armed="1";const lb=el.innerHTML;el.classList.add("armed");if(el.classList.contains("trash"))el.querySelector("span").textContent="もう一度";else el.textContent="もう一度押すと削除";setTimeout(()=>{if(el.isConnected){delete ds.armed;el.classList.remove("armed");el.innerHTML=lb}},3000);return}
    if(ds.delItem){const r=await removeItems([ds.delItem]);if(r.n){dlg.close();toast(delMsg(r))}}
    else if(ds.delExp){if(await del("exps",ds.delExp)){dlg.close();toast("削除しました")}}
    else{const tid=ds.delTitle,nn=Object.values(S.items).filter(i=>i.titleId===tid).length;if(await removeTitle(tid)){dlg.close();toast(nn?`削除しました（景品${nn}点も消しました）`:"削除しました")}}
    return;
  }
  if(ds.dupItem){const s=S.items[ds.dupItem];itemDialog(null,Object.assign({},s,{id:undefined,status:"stock",salePrice:null,sDate:"",feeAmount:null,priceLog:[],listedDate:"",sample:false}));return}
  if(ds.addToTitle){const t=S.titles[ds.addToTitle];itemDialog(null,{titleId:t.id,cat1:t.cat1,cat2:t.cat2,card:t.card,buyer:t.buyer,pDate:t.pDate});return}
  if(ds.add){const box=document.querySelector(`[data-list="${ds.add}"]`);const d=document.createElement("div");d.className="fr li";d.innerHTML=ds.pair?`<input aria-label="名前"><input class="nn" type="number" inputmode="decimal" aria-label="${ds.pair}"><span class="unit">${ds.pair}</span><button type="button" class="rm" data-rm>削除</button>`:`<input aria-label="項目"><button type="button" class="rm" data-rm>削除</button>`;box.insertBefore(d,el);d.querySelector("input").focus();return}
  if(el.hasAttribute("data-rm")){el.closest(".li").remove();return}
  if(a==="sell"){withIntro("sold",()=>sellDialog(),el);return}
  if(ds.pick){sellDialog(ds.pick);return}
  if(a==="new-item")withIntro("box",()=>itemDialog(),el);
  if(a==="new-title")withIntro(Math.random()<.5?"kuji":"capsule",()=>titleDialog(),el);
  if(a==="new-exp")withIntro("receipt",()=>expDialog(),el);
  if(a==="new-item-day")itemDialog(null,{pDate:S.cal.sel});
  if(a==="new-exp-day")expDialog(null,{date:S.cal.sel});
  if(a==="calc")withIntro("calc",()=>calcDialog(),el);
  if(a==="export-items"){const D=derive();exportCsv("せどりっちょ_商品.csv",itemRows(filteredItems(D,cfg())))}
  if(a==="backup"){exportBackup();return}
  if(a==="export-all")exportCsv("せどりっちょ_全商品.csv",itemRows(Object.values(S.items)));
  if(a==="export-year"){const y=ds.y,D=derive();const rows=[["日付","種類","内容","金額","手数料・送料","原価","利益","カード","担当"]];
    events(D).filter(e=>e.date.startsWith(y)).reverse().forEach(e=>{if(e.type==="sell"){const i=S.items[e.ref[1]],r=D.R[i.id];rows.push([e.date,"売上",e.label,r.sale,r.fee+r.ship,Math.round(r.alloc),Math.round(r.profit),"",""])}else{const src=e.ref[0]==="title"?S.titles[e.ref[1]]:e.ref[0]==="exp"?S.exps[e.ref[1]]:S.items[e.ref[1]];rows.push([e.date,e.type==="buy"?"仕入":"経費",e.label,e.amount,"","","",src?.card||"",src?.buyer||""])}});
    exportCsv(`せどりっちょ_${y}年.csv`,rows)}
  if(a==="export-person"){const p=S.st.person,m=S.st.month;const rows=purchases(true).filter(x=>x.buyer===p&&(!m||(ym(x.date)||"日付なし")===m));exportCsv(`精算_${p}${m?"_"+m:""}.csv`,[["日付","種類","内容","カード","金額"]].concat(rows.map(r=>[r.date,r.kind,r.label,r.card,r.amount])).concat([["","","合計","",rows.reduce((s,r)=>s+r.amount,0)]]))}
  if(a==="del-sample"){if(!ds.armed){ds.armed="1";el.textContent="もう一度押すと削除";return}
    for(const i of Object.values(S.items).filter(i=>i.sample))await del("items",i.id);for(const t of Object.values(S.titles).filter(t=>t.sample))await del("titles",t.id);toast("サンプルを削除しました")}
  if(a==="reset-ships"){const box=document.querySelector('[data-list="ships"]');box.querySelectorAll(".li").forEach(x=>x.remove());const addb=box.querySelector("[data-add]");SHIPS_LATEST.forEach(s=>{const d=document.createElement("div");d.className="fr li";d.innerHTML=`<input aria-label="名前" value="${esc(s.name)}"><input class="nn" type="number" inputmode="decimal" aria-label="円" value="${s.cost}"><span class="unit">円</span><button type="button" class="rm" data-rm>削除</button>`;box.insertBefore(d,addb)});toast("最新の目安を入れました。保存で確定します")}
  if(a==="save-settings"){
    const C=cfg(),c={theme:C.theme||null,quick:C.quick||null,defaultRate:+$("#s-rate").value||0,goal:+$("#s-goal").value||0,staleDays:Math.max(1,+$("#s-stale").value||30)};
    ["cats","cards","people"].forEach(k=>c[k]=[...document.querySelectorAll(`[data-list="${k}"] .li input`)].map(x=>x.value.trim()).filter(Boolean));
    ["platforms","ships"].forEach(k=>{const f2=k==="ships"?"cost":"rate";c[k]=[...document.querySelectorAll(`[data-list="${k}"] .li`)].map(li=>{const [x,y]=li.querySelectorAll("input");return{name:x.value.trim(),[f2]:+y.value||0}}).filter(x=>x.name)});
    if(!c.cats.length)c.cats=C.cats;
    if(await putCfg(c))toast("保存しました");
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[role=button]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{if(e.target.id==="f-q"){S.f.q=e.target.value;const p=e.target.selectionStart;render();const q=$("#f-q");if(q){q.focus();try{q.setSelectionRange(p,p)}catch(x){}}}});
function setThemeKey(k,v,save){
  const C=cfg();themeDraft=Object.assign({},DEF_THEME,themeDraft||C.theme||{},{[k]:v});
  if(k==="main"&&themeDraft.k1.toLowerCase()===(C.theme?.main||DEF_THEME.main).toLowerCase())themeDraft.k1=v;
  applyTheme(themeDraft);
  document.querySelectorAll("[data-th]").forEach(x=>{x.value=themeDraft[x.dataset.th]});document.querySelectorAll("[data-hx]").forEach(x=>{x.textContent=themeDraft[x.dataset.hx]});
  document.querySelectorAll("[data-swatch]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.swatch===themeDraft.main.toLowerCase()));
  if(save)saveTheme();
}
let themeTimer;
function saveTheme(){clearTimeout(themeTimer);themeTimer=setTimeout(async()=>{const t=themeDraft;if(!t)return;if(await putCfg(Object.assign({},S.cfg||{},{theme:t}))){themeDraft=null;toast("色を保存しました")}},250)}
document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.th)setThemeKey(e.target.dataset.th,e.target.value,false)});
document.addEventListener("change",e=>{if(e.target.id==="bk-in"&&e.target.files&&e.target.files[0]){importBackup(e.target.files[0]);e.target.value="";return}});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.th){setThemeKey(e.target.dataset.th,e.target.value,true);return}});
document.addEventListener("change",e=>{const m={"f-cat":["f","cat"],"f-title":["f","title"],"f-sort":["f","sort"],"f-month":["st","month"],"f-year":["st","year"]}[e.target.id];if(m){S[m[0]][m[1]]=e.target.value;render()}});
dlg.addEventListener("close",()=>{dlg.innerHTML=""});
window.addEventListener("scroll",()=>$("#hdr").classList.toggle("sc",scrollY>4),{passive:true});
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".quick button");if(b){b.classList.add("press");const up=()=>{setTimeout(()=>{b.classList.remove("press");b.classList.add("boing");setTimeout(()=>b.classList.remove("boing"),460)},70);removeEventListener("pointerup",up);removeEventListener("pointercancel",up)};addEventListener("pointerup",up);addEventListener("pointercancel",up)}});
document.addEventListener("touchstart",()=>{},{passive:true});
S.enter=true;
boot();
})();
</script>
<script>
if("serviceWorker" in navigator){
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload()});
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update().catch(()=>{});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update().catch(()=>{})})}).catch(()=>{})});
}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
</script>

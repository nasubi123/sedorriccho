<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="せどりっちょ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>せどりっちょ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Yusei+Magic&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
html{-webkit-user-select:none;user-select:none} input,textarea{-webkit-user-select:text;user-select:text}
</style>
<style>
/* Layout: white cards on a barely-tinted page. Turquoise hero + bento tiles on Home, framed cards everywhere, bottom tab bar. Turquoise = 仕入れ/操作, orange = 売上, gray = 経費 */
:root{
  color-scheme:light;
  --page:#ffffff; --card:#ffffff; --soft:#f4f6f7; --ink:#13181b; --ink2:#59636a; --ink3:#99a2a8; --line:#e8ecee; --fill:#eef2f4;
  --teal:#11a6b5; --teal-d:#0d8f9c; --teal-ink:#076f7a; --teal-bg:#e2f5f7;
  --orange:#f5821f; --orange-ink:#b85706; --orange-bg:#fff0e2;
  --red:#d4433d; --red-bg:#fdecea; --exp:#7c8a94; --exp-bg:#eef1f3;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --num:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",-apple-system,"Noto Sans JP",sans-serif;
  --r:18px; --navh:58px;
  --sh:none; --brand:"Yusei Magic","Hiragino Maru Gothic ProN",var(--font);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html:has(dialog[open]){overflow:hidden}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:.01em;padding:0 16px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px));font-feature-settings:"palt" 1}
.n,.amt,.big,td.r,.v{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:880px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgb(243 246 247 / .9);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);margin:0 -16px;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;flex:none;border-radius:9px;box-shadow:0 2px 6px rgb(17 166 181 / .35)}
.logo .spin{transform-box:view-box;transform-origin:50% 50%;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
header.top h1{flex:1;min-width:0;margin:0;font-size:22px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);background:var(--card);box-shadow:var(--sh)}
.hbtn svg{width:21px;height:21px}
.hbtn.add{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgb(17 166 181 / .35)}
.hbtn[aria-pressed="true"]{color:var(--teal-ink);background:var(--teal-bg)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(5,1fr);background:rgb(255 255 255 / .94);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:.5px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.tabs button{display:grid;justify-items:center;gap:1px;padding:5px 0 3px;color:var(--ink3);font-size:10px;font-weight:600;min-height:48px;position:relative}
nav.tabs svg{width:25px;height:25px}
nav.tabs button[aria-selected="true"]{color:var(--teal)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--num)}
@media (min-width:760px){nav.tabs{left:50%;right:auto;bottom:16px;transform:translateX(-50%);width:460px;border:.5px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgb(0 0 0 / .1);padding:4px}}

main{display:grid;gap:16px;padding-block:4px 12px;grid-template-columns:minmax(0,1fr)}
main > *{min-width:0}
@keyframes rise{from{transform:translateY(6px)}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.card.flush{padding:4px 16px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ch h2{margin:0;font-size:16px;font-weight:800}
.ch .r{margin-left:auto}
.link{color:var(--teal-ink);font-size:14px;font-weight:600}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.plus{color:var(--ink)} .minus{color:var(--red)}
.note{font-size:12.5px;color:var(--ink2);margin:0}
.key{display:inline-block;width:8px;height:8px;border-radius:2px;flex:none}
.key.buy{background:var(--teal)} .key.sell{background:var(--orange)} .key.exp{background:var(--exp)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);min-height:32px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .1)}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--teal);color:#fff;border-radius:22px;padding:16px 18px 18px;box-shadow:0 10px 24px rgb(17 166 181 / .28)}
.hero .deco{position:absolute;right:-46px;top:-46px;width:190px;height:190px;opacity:.16;pointer-events:none}
.hero .deco{transform-origin:50% 50%;animation:spin 28s linear infinite}
.hero .mnav{display:flex;align-items:center;gap:4px;position:relative}
.hero .mnav b{font-size:15px;font-weight:700;min-width:6.5em;text-align:center}
.hero .mnav button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:rgb(255 255 255 / .18)}
.hero .mnav button svg{width:16px;height:16px}
.hero .mnav button:disabled{opacity:.35}
.hero .row{display:flex;align-items:center;gap:14px;margin-top:12px;position:relative}
.hero .cap{font-size:13px;opacity:.85}
.hero .big{font-size:40px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.hero .big small{font-size:22px;margin-right:1px}
.hero .ring{margin-left:auto;flex:none;width:76px;height:76px;position:relative}
.hero .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hero .ring span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.2}
.hero .ring span b{display:block;font-size:17px;font-family:var(--num)}
.hero .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;position:relative}
.hero .mini div{background:rgb(255 255 255 / .16);border-radius:12px;padding:8px 10px;min-width:0}
.hero .mini span{font-size:11px;opacity:.85;display:block}
.hero .mini b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.hero .minus,.hero .plus{color:#fff}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick button{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);padding:4px 0}
.quick .qi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh)}
.quick .qi svg{width:24px;height:24px}
.quick .q1 .qi{color:var(--teal-ink);background:var(--teal-bg)}
.quick .q2 .qi{color:var(--orange-ink);background:var(--orange-bg)}
.quick .q3 .qi{color:var(--exp);background:var(--exp-bg)}
.quick .q4 .qi{color:#fff;background:var(--ink)}

/* todo tiles */
.todo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border-radius:16px;padding:12px;display:grid;gap:2px;text-align:left;background:var(--card);box-shadow:var(--sh);min-width:0}
.tile .tl{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.tile .tl svg{width:15px;height:15px;flex:none}
.tile .v{font-size:26px;font-weight:700;line-height:1.2}
.tile .v small{font-size:13px;font-weight:600;margin-left:2px}
.tile .ts{font-size:11px;color:var(--ink2);line-height:1.35}
.tile.o{background:var(--orange-bg)} .tile.o .tl{color:var(--orange-ink)}
.tile.r{background:var(--red-bg)} .tile.r .tl{color:var(--red)}
.tile.t{background:var(--teal-bg)} .tile.t .tl{color:var(--teal-ink)}
.tile.zero .v{color:var(--ink3)}

/* stat grid inside cards */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.kv > div{background:var(--card);padding:10px 12px;display:grid;gap:1px;min-width:0}
.kv span{font-size:11.5px;color:var(--ink2)}
.kv b{font-size:17px;font-weight:700;font-family:var(--num);overflow-wrap:anywhere}

/* chart */
.chart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.col{display:grid;gap:5px;justify-items:center;min-width:0;cursor:pointer;border-radius:10px;padding:4px 0}
.col.sel{background:var(--fill)}
.bars{height:118px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bars i{width:min(13px,36%);border-radius:4px 4px 1px 1px;min-height:2px}
.bars i.buy{background:var(--teal)} .bars i.sell{background:var(--orange)}
.col .m{font-size:12px;color:var(--ink2);font-weight:600}
.col .p{font-size:11px;font-weight:700;white-space:nowrap;font-family:var(--num)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* list rows */
.rows > *+*{border-top:.5px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:50px;width:100%;text-align:left}
[role=button].row,[role=button].icard{cursor:pointer}
.row .main{flex:1;min-width:0;display:grid;gap:1px}
.t1{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t2{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side{text-align:right;display:grid;gap:1px;flex:none}
.amt{font-weight:700;white-space:nowrap}
.sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.chev{color:var(--ink3);flex:none;width:8px;height:14px}
.th{width:46px;height:46px;border-radius:12px;flex:none;background:var(--fill);display:grid;place-items:center;object-fit:cover;overflow:hidden}
.th svg{width:22px;height:22px;color:var(--ink3)}
.th.lg{width:64px;height:64px;border-radius:14px}
.th.lg svg{width:28px;height:28px}
.th img{width:100%;height:100%;object-fit:cover}
.etag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;flex:none}
.etag.buy{color:var(--teal-ink);background:var(--teal-bg)} .etag.sell{color:var(--orange-ink);background:var(--orange-bg)} .etag.exp{color:var(--exp);background:var(--exp-bg)}
.prz{font-weight:800;color:var(--orange-ink);margin-right:4px}

/* item cards */
.cards{display:grid;gap:8px}
.icard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);min-width:0;transition:transform .12s}
.icard:active{transform:scale(.985)}
.icard .main{flex:1;min-width:0;display:grid;gap:3px}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--fill);color:var(--ink2)}
.pill.stock{background:var(--fill);color:var(--ink2)}
.pill.listed{background:var(--teal-bg);color:var(--teal-ink)}
.pill.shipping{background:var(--orange);color:#fff}
.pill.sold{background:var(--orange-bg);color:var(--orange-ink)}
.pill.kept{background:var(--exp-bg);color:var(--exp)}
.pill.warn{background:var(--red-bg);color:var(--red)}
.pill.days{background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)}

/* filters */
.search{display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--sh);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:17px;height:17px;color:var(--ink3);flex:none}
.search input{border:0;background:none;padding:0;height:100%;font-size:16px;width:100%;min-width:0}
.search input:focus{outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;background:var(--card);color:var(--ink2);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);display:inline-flex;gap:5px;align-items:center}
.chip .c{font-family:var(--num);font-size:12px;color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.chip[aria-pressed="true"] .c{color:rgb(255 255 255 / .7)}
.chip.alert[aria-pressed="false"]{color:var(--red);box-shadow:inset 0 0 0 1px #f5c9c6}
.pick{position:relative;flex:none;display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:7px 26px 7px 12px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);white-space:nowrap;max-width:220px}
.pick.on{background:var(--teal-bg);color:var(--teal-ink);box-shadow:none}
.pick span{overflow:hidden;text-overflow:ellipsis}
.pick::after{content:"";position:absolute;right:11px;top:50%;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg)}
.pick select{position:absolute;inset:0;opacity:0;font-size:16px;width:100%;cursor:pointer}
.stack{display:grid;gap:10px}
.sumbar{display:flex;gap:8px;flex-wrap:wrap}
.sumbar span{font-size:12.5px;color:var(--ink2);background:var(--card);border-radius:99px;padding:4px 10px;box-shadow:inset 0 0 0 1px var(--line)}
.sumbar b{color:var(--ink);font-family:var(--num)}

/* titles */
.tcard{display:grid;gap:12px;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh);cursor:pointer;min-width:0}
.tcard .top{display:flex;gap:12px;align-items:center}
.tcard .top .main{flex:1;min-width:0;display:grid;gap:4px}
.tcard h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
.tcard .bal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tcard .bal .big{font-size:28px;font-weight:700}
.meter{position:relative;height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--orange)}
.meter.ok i{background:var(--teal)}
.meter b{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff}
.mlab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-top:4px}
.mlab b{color:var(--ink);font-family:var(--num)}
.pz{display:flex;flex-wrap:wrap;gap:4px}
.pz span{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--ink3)}
.pz span.listed{background:var(--teal-bg);color:var(--teal-ink)}
.pz span.sold,.pz span.shipping{background:var(--orange-bg);color:var(--orange-ink)}

/* calendar */
.calhead{display:flex;align-items:center;gap:6px}
.calhead h2{font-size:20px;font-weight:800;margin:0;flex:1}
.calhead .nav{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);background:var(--fill)}
.calhead .nav svg{width:17px;height:17px}
.calhead .today{font-size:13px;font-weight:700;color:var(--teal-ink);padding:7px 12px;border-radius:99px;background:var(--teal-bg)}
.ctiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ctile{border-radius:14px;padding:9px 11px;display:grid;gap:1px;min-width:0}
.ctile span{font-size:11.5px;font-weight:700}
.ctile b{font-size:16px;font-family:var(--num);overflow-wrap:anywhere}
.ctile.buy{background:var(--teal-bg)} .ctile.buy span{color:var(--teal-ink)}
.ctile.sell{background:var(--orange-bg)} .ctile.sell span{color:var(--orange-ink)}
.ctile.pf{background:var(--fill)} .ctile.pf span{color:var(--ink2)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px}
.dow{font-size:11px;font-weight:700;color:var(--ink3);text-align:center;padding:2px 0 4px}
.dow.sun{color:var(--red)} .dow.sat{color:var(--teal-ink)}
.day{min-height:68px;border-radius:10px;padding:3px 2px;display:grid;align-content:start;justify-items:center;gap:2px;cursor:pointer;min-width:0;background:var(--page);transition:background .15s}
.day.pad{background:none;cursor:default}
.day.has-sell{background:#fff7ef}
.day .d{font-size:12.5px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-family:var(--num)}
.day.sun .d{color:var(--red)} .day.sat .d{color:var(--teal-ink)}
.day.today .d{box-shadow:inset 0 0 0 1.5px var(--teal);color:var(--teal-ink)}
.day.sel{background:var(--ink)}
.day.sel .d{color:#fff;box-shadow:none}
.day .mk{font-size:9px;font-weight:700;line-height:1.25;white-space:nowrap;max-width:100%;overflow:hidden;border-radius:4px;padding:1px 3px;font-family:var(--num)}
.day .mk.buy{color:var(--teal-ink);background:var(--teal-bg)} .day .mk.sell{color:#fff;background:var(--orange)}
.day .ex{width:5px;height:5px;border-radius:50%;background:var(--exp)}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
.dayhead h3{margin:0;font-size:16px;font-weight:800}
.dayhead span{font-size:12.5px;color:var(--ink2)}

/* table */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 8px;text-align:left;white-space:nowrap;border-bottom:.5px solid var(--line)}
th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
th{font-size:11.5px;font-weight:600;color:var(--ink3)}
td.r,th.r{text-align:right}
tr.sub td:first-child{padding-left:14px;color:var(--ink2)}
tr.total td{font-weight:800;border-bottom:0}
.hbar{height:8px;border-radius:4px;background:var(--fill);position:relative;overflow:hidden;margin-top:6px}
.hbar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--teal)}
.hbar.o i{background:var(--orange)} .hbar.r i{background:var(--red)}
.line200{position:relative;height:12px;border-radius:6px;background:var(--fill);overflow:hidden}
.line200 i{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:6px}
.line200.over i{background:var(--orange)}

/* empty / buttons */
.empty{padding:36px 12px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--ink2)}
.empty .em{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--teal-bg);color:var(--teal-ink)}
.empty .em svg{width:30px;height:30px}
.empty b{color:var(--ink);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;border-radius:13px;padding:11px 18px;min-height:46px;background:var(--fill);color:var(--ink)}
.btn.pri{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgb(17 166 181 / .3)}
.btn.sm{font-size:13px;padding:7px 12px;min-height:34px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.btn.block{width:100%}

/* sheet */
dialog{border:0;padding:0;background:var(--page);color:var(--ink);width:min(560px,calc(100% - 32px));max-height:calc(100dvh - 48px);border-radius:18px;box-shadow:0 24px 80px rgb(0 0 0 / .25)}
dialog::backdrop{background:rgb(10 20 24 / .35)}
.sheet{display:grid;grid-template-rows:auto minmax(0,1fr);max-height:calc(100dvh - 48px)}
.sheet > header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;background:var(--page)}
.sheet > header h2{margin:0;font-size:16px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.sheet > header .l{justify-self:start;color:var(--teal-ink);font-size:16px;padding:6px 0}
.sheet > header .rr{justify-self:end;color:#fff;background:var(--teal);font-size:15px;font-weight:700;padding:6px 16px;border-radius:99px}
.sheet > header .rr:disabled{background:var(--ink3)}
.sheet .body{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:18px;align-content:start}
.grp{display:grid;gap:6px}
.grp > .gh{font-size:12.5px;font-weight:700;color:var(--ink2);padding:0 4px;display:flex;justify-content:space-between;align-items:center}
.box{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.fr{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:48px;position:relative}
.fr + .fr,.box > * + .fr{box-shadow:inset 0 .5px 0 var(--line)}
.fr > span:first-child{flex:none;font-size:15px;min-width:6em}
.fr input,.fr select{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;text-align:right;color:var(--ink);padding:12px 0;-webkit-appearance:none;appearance:none}
.fr input[type=number]{font-family:var(--num);font-weight:600}
.fr select{direction:rtl;padding-right:16px;color:var(--ink2)}
.fr select option{direction:ltr}
.fr:has(select)::after{content:"";position:absolute;right:16px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:translateY(-50%) rotate(-45deg)}
.fr input::placeholder{color:var(--ink3);font-weight:400}
.fr input[type=date]{min-height:44px;display:flex;justify-content:flex-end}
.fr input:focus,.fr select:focus{outline:none}
.fr:focus-within{background:#fbfdfd}
.fr.full input{text-align:left;font-weight:700;font-size:17px}
.fr.ta{display:block;padding:10px 14px}
.fr.ta textarea{width:100%;border:0;background:none;font:inherit;font-size:16px;resize:vertical;min-height:72px;padding:0;color:var(--ink)}
.fr.ta textarea:focus{outline:none}
.unit{color:var(--ink3);font-size:14px;flex:none;margin-left:-6px}
.box .seg{margin:10px 12px}
.stgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px 12px}
.stgrid button{border-radius:10px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--ink2);background:var(--fill);min-height:40px}
.stgrid button[aria-pressed="true"][data-v="stock"]{background:var(--ink);color:#fff}
.stgrid button[aria-pressed="true"][data-v="listed"]{background:var(--teal);color:#fff}
.stgrid button[aria-pressed="true"][data-v="shipping"],.stgrid button[aria-pressed="true"][data-v="sold"]{background:var(--orange);color:#fff}
.stgrid button[aria-pressed="true"][data-v="kept"]{background:var(--exp);color:#fff}
.act{display:flex;align-items:center;justify-content:center;min-height:48px;width:100%;font-size:16px;font-weight:600;color:var(--teal-ink)}
.act.del{color:var(--red)}
.act + .act{box-shadow:inset 0 .5px 0 var(--line)}
.mini-btn{font-size:13px;font-weight:700;color:var(--orange-ink);background:var(--orange-bg);border-radius:99px;padding:5px 11px;flex:none}
.plog{padding:8px 14px 12px;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.plog span{background:var(--fill);border-radius:6px;padding:2px 7px;font-family:var(--num)}
/* receipt */
.rcpt{background:var(--card);border-radius:14px;padding:16px;display:grid;gap:7px;font-size:14px;box-shadow:var(--sh);position:relative}
.rcpt::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:12px;background:radial-gradient(circle at 6px 0,transparent 5px,var(--card) 5.5px) 0 0/12px 12px repeat-x;transform:rotate(180deg)}
.rcpt .hd{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.08em;display:flex;justify-content:space-between}
.rcpt .ln{display:flex;justify-content:space-between;gap:12px;color:var(--ink2)}
.rcpt .ln b{font-weight:600;color:var(--ink);font-family:var(--num)}
.rcpt .tot{border-top:1.5px dashed var(--line);margin-top:4px;padding-top:10px;display:flex;justify-content:space-between;align-items:baseline}
.rcpt .tot span{font-weight:700}
.rcpt .tot b{font-size:26px;font-weight:700;font-family:var(--num)}
.rcpt .meta{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.rcpt .meta span{font-size:12px;font-weight:700;background:var(--fill);border-radius:99px;padding:2px 9px;color:var(--ink2)}
.imgrow{display:flex;align-items:center;gap:14px;padding:12px 14px}
.imgrow .th{width:80px;height:80px;border-radius:14px}
.imgrow .b{display:grid;gap:6px;justify-items:start}
.filelbl{position:relative;color:var(--teal-ink);font-size:15px;font-weight:700;cursor:pointer}
.filelbl input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.filelbl:focus-within{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
/* menu sheet */
.menu{display:grid;gap:10px;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.menu button{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:left}
.menu .qi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
.menu .qi svg{width:22px;height:22px}
.menu b{display:block;font-size:16px}
.menu small{font-size:12.5px;color:var(--ink2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 20px + env(safe-area-inset-bottom,0px));background:rgb(19 24 27 / .92);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:30;white-space:nowrap}
.local{font-size:12px;color:var(--ink2);background:var(--card);border-radius:12px;padding:8px 12px}
.le .fr input{text-align:left}
.le .fr input.nn{flex:0 0 72px;text-align:right}
.le .rm{color:var(--red);font-size:14px;flex:none;padding:6px 0 6px 4px}

/* ---- motion & delight ---- */
.lane{position:relative;height:76px;overflow:hidden;pointer-events:none}
.lane::after{content:"";position:absolute;left:0;right:0;bottom:5px;border-top:2px dashed rgb(255 255 255 / .38)}
.lane.light::after{border-top-color:#d9e1e4}
.hero .lane{margin:4px -18px -18px}
.cartgo{position:absolute;bottom:4px;left:100%;width:84px;height:62px;animation:drive 8.5s linear infinite}
.cartgo .roll{transform-box:fill-box;transform-origin:center;animation:wheel .7s linear infinite}
.cartgo svg{width:100%;height:100%;overflow:visible;display:block}
.cartgo .bob{animation:bob .3s ease-in-out infinite alternate}
.cartgo .wheel{transform-box:view-box;animation:wheel .45s linear infinite}
.cartgo .sp{position:absolute;right:-20px;top:22px;width:16px;height:13px;background:repeating-linear-gradient(to bottom,rgb(255 255 255 / .75) 0 2px,transparent 2px 4.5px);border-radius:2px;animation:flick .25s steps(2) infinite}
.lane.light .cartgo .sp{background:repeating-linear-gradient(to bottom,#c7d3d7 0 2px,transparent 2px 4.5px)}
@keyframes drive{0%{left:100%}86%{left:-120px}100%{left:-120px}}
@keyframes bob{to{transform:translateY(-1.6px)}}
@keyframes wheel{to{transform:rotate(-360deg)}}
@keyframes flick{50%{opacity:.35}}
.tip{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);text-align:left;width:100%;font-size:13.5px;line-height:1.45}
.tip .tc{width:30px;height:30px;flex:none}
.tip .tt{flex:1;min-width:0}
.tip b{font-family:var(--num)}
.tip .nx{flex:none;font-size:11px;font-weight:700;color:var(--ink3);background:var(--fill);border-radius:99px;padding:2px 8px;font-family:var(--num)}
.tip .tt.swap{animation:tipin .3s ease-out}
@keyframes tipin{from{transform:translateY(6px)}}
.th{position:relative}
.th.sold::after{content:"SOLD";position:absolute;top:6px;left:-15px;width:54px;transform:rotate(-45deg);background:var(--orange);color:#fff;font-size:7.5px;font-weight:800;letter-spacing:.08em;text-align:center;line-height:13px;font-family:var(--num);box-shadow:0 1px 2px rgb(0 0 0 / .15)}
.th.lg.sold::after{top:9px;left:-16px;width:62px;font-size:8.5px;line-height:15px}
.pill.shipping{display:inline-flex;align-items:center;gap:4px}
.pill.shipping svg{width:13px;height:13px;animation:bump .6s ease-in-out infinite alternate}
@keyframes bump{to{transform:translateX(-2px)}}
.quick .qi{transition:transform .15s}
.quick button:active .qi{transform:scale(.9)}
.day.today .d{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:inset 0 0 0 1.5px var(--teal),0 0 0 0 rgb(17 166 181 / .35)}70%{box-shadow:inset 0 0 0 1.5px var(--teal),0 0 0 7px rgb(17 166 181 / 0)}100%{box-shadow:inset 0 0 0 1.5px var(--teal),0 0 0 0 rgb(17 166 181 / 0)}}
.day.sel .d{animation:none}
.hero .ring circle.fg{animation:ringfill 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringfill{from{stroke-dashoffset:var(--c)}}
html.enter main > *{animation:rise .32s ease-out both}
html.enter main > *:nth-child(2){animation-delay:.04s} html.enter main > *:nth-child(3){animation-delay:.08s} html.enter main > *:nth-child(4){animation-delay:.12s} html.enter main > *:nth-child(5){animation-delay:.16s}
html.enter .bars i{animation:barup .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
html.enter .meter i,html.enter .hbar i,html.enter .line200 i{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}

@keyframes barup{from{transform:scaleY(0)}}
@keyframes grow{from{width:0}}
@keyframes pop{40%{transform:translateY(-4px) scale(1.12)}}
.empty .lane{width:min(320px,100%);margin:-8px 0 -4px}
.fx{position:fixed;inset:0;z-index:40;pointer-events:none}
.toast.big{font-size:15px;padding:12px 20px;background:var(--orange)}
@media (prefers-reduced-motion:reduce){.cartgo{left:auto;right:24px}.cartgo .sp{display:none}}

/* ---- Instagram-like flat layer ---- */
header.top{background:rgb(255 255 255 / .94);display:grid;grid-template-columns:44px 1fr 44px;padding:8px 12px;margin:0 -16px;border-bottom:.5px solid transparent}
header.top.sc{border-bottom-color:var(--line)}
header.top .hbtn{width:40px;height:40px;background:none;box-shadow:none;color:var(--ink)}
header.top .hbtn svg{width:26px;height:26px}
header.top .hbtn.add{background:none;color:var(--ink);box-shadow:none}
header.top .hbtn[aria-pressed="true"]{background:var(--soft)}
#gear{justify-self:end}
.ttl{display:grid;place-items:center;min-width:0}
.ttl h1{margin:0;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm{position:relative;display:inline-block;font-family:var(--brand);font-size:26px;line-height:1.05;letter-spacing:.04em;color:var(--ink);padding:0 14px 6px 2px}
.wm .sw{position:absolute;left:8%;right:10%;bottom:-2px;width:86%;height:10px;overflow:visible}
.wm .sw path{stroke-dasharray:140;stroke-dashoffset:0;animation:draw 1.1s .2s cubic-bezier(.3,.7,.2,1) both}
.wm .cp{position:absolute;right:-2px;top:-3px;width:15px;height:15px;transform-origin:50% 60%;animation:wob 4.5s ease-in-out infinite}
@keyframes draw{from{stroke-dashoffset:140}}
@keyframes wob{0%,82%,100%{transform:rotate(18deg)}86%{transform:rotate(-14deg) translateY(-2px)}90%{transform:rotate(26deg)}94%{transform:rotate(10deg)}}
nav.tabs{grid-template-columns:repeat(5,1fr);padding:2px 4px calc(2px + env(safe-area-inset-bottom,0px));background:rgb(255 255 255 / .96)}
nav.tabs button{min-height:50px;color:var(--ink);align-content:center;gap:3px}
nav.tabs button svg{width:27px;height:27px;stroke-width:1.6}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"] svg{stroke-width:2.5}
nav.tabs{padding-top:6px;overflow:visible}
nav.tabs button{display:grid;place-items:center;min-height:52px;color:var(--ink2)}
nav.tabs .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .28s cubic-bezier(.3,1.5,.5,1),background .2s,color .2s,box-shadow .2s}
nav.tabs .ic svg{width:25px;height:25px}
nav.tabs button[aria-selected="true"]{color:var(--on-main,#fff)}
nav.tabs button[aria-selected="true"] .ic{background:var(--teal);color:var(--on-main,#fff);transform:translateY(-10px) scale(1.18);box-shadow:0 8px 16px -6px var(--teal),0 0 0 4px #fff}
nav.tabs button[aria-selected="true"] svg{stroke-width:2.1}
nav.tabs button.center .ic{width:48px;height:48px;background:var(--soft);color:var(--ink)}
nav.tabs button.center[aria-selected="true"] .ic{background:var(--teal);color:var(--on-main,#fff)}
nav.tabs .badge{top:0;left:calc(50% + 8px)}
nav.tabs .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.card{background:var(--soft);box-shadow:none}
.hero{box-shadow:none}
.tile,.quick .qi,.tip,.search,.tcard,.rcpt,.box,.menu button{box-shadow:none}
.tip{background:var(--soft)}
.search{background:var(--soft)}
.chip{background:var(--soft);box-shadow:none}
.chip.alert[aria-pressed="false"]{box-shadow:none;background:var(--red-bg)}
.pick{background:var(--soft);box-shadow:none}
.sumbar span{background:none;box-shadow:none;padding:0 2px}
.btn.sm{background:var(--soft);box-shadow:none;border-radius:9px}
.btn.pri{box-shadow:none;border-radius:12px}
.kv{background:#e6eaec}
.kv > div{background:var(--soft)}
.tcard{background:var(--soft)}
.cards{gap:0}
.icard{background:none;border-radius:0;box-shadow:none;padding:11px 0;border-bottom:.5px solid var(--line)}
.icard:last-child{border-bottom:0}
dialog{background:#f2f4f5}
.sheet > header{background:#f2f4f5}
.menu button{background:#fff}
.local{background:var(--soft)}
/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:70px;display:grid;justify-items:center;gap:5px;font-size:11.5px;color:var(--ink)}
.story .rg{width:70px;height:70px;border-radius:50%;padding:2.5px;background:conic-gradient(from 200deg,#11a6b5,#3cc0a6,#ffc531,#f5821f,#ff6b6b,#11a6b5)}
.story .rg.seen{background:#dbe1e4}
.story .rg.ship{background:conic-gradient(from 200deg,#ffc531,#f5821f,#ffc531)}
.story .in{width:100%;height:100%;border-radius:50%;border:3px solid #fff;overflow:hidden;background:var(--soft);display:grid;place-items:center;position:relative}
.story .in img{width:100%;height:100%;object-fit:cover}
.story .in svg{width:26px;height:26px;color:var(--ink2)}
.story .lb{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story.add .rg{background:none;padding:0}
.story.add .in{border:0}
.story.add .pl{position:absolute;right:-1px;bottom:-1px;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;border:3px solid #fff;display:grid;place-items:center}
.story.add .pl svg{width:12px;height:12px;color:#fff}
.story .ct{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;font-family:var(--num);background:var(--orange);color:#fff;border:2px solid #fff;border-radius:99px;padding:0 6px;line-height:16px}
/* view tabs + grid */
.vtabs{display:grid;grid-template-columns:1fr 1fr;margin:0 -16px;border-bottom:.5px solid var(--line)}
.vtabs button{height:44px;display:grid;place-items:center;color:var(--ink3);border-bottom:1.5px solid transparent;margin-bottom:-.5px}
.vtabs button svg{width:24px;height:24px}
.vtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:0 -16px}
.gt{position:relative;aspect-ratio:1;overflow:hidden;display:grid;place-items:center;align-content:center;gap:6px;background:var(--soft);cursor:pointer;padding:10px;text-align:center}
.gt.c1{background:#fff3e6} .gt.c2{background:#e5f6f7}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gt > svg{width:30px;height:30px;color:var(--ink2)}
.gt .gn{font-size:11px;font-weight:700;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gt .gp{position:absolute;left:6px;bottom:6px;font:700 11.5px var(--num);color:#fff;background:rgb(10 16 18 / .62);border-radius:6px;padding:1px 6px}
.gt .gd{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:var(--ink3)}
.gt .gd.listed{background:var(--teal)} .gt .gd.shipping{background:var(--orange);animation:pulse2 1.6s infinite} .gt .gd.kept{background:var(--exp)} .gt .gd.stale{background:var(--red)}
@keyframes pulse2{50%{transform:scale(1.35)}}
.gt.sold::after{content:"SOLD";position:absolute;top:10px;left:-20px;width:76px;transform:rotate(-45deg);background:var(--orange);color:#fff;font-size:9px;font-weight:800;letter-spacing:.08em;text-align:center;line-height:16px;font-family:var(--num)}
.gt:active{filter:brightness(.94)}

/* tactile quick keys */
.quick{gap:10px;padding-top:2px}
.quick button{gap:8px;font-size:12px;font-weight:800;color:var(--ink);padding:0 0 4px}
.quick .qi{position:relative;width:62px;height:58px;border-radius:19px;color:#fff;background:linear-gradient(180deg,var(--k1),var(--k2));box-shadow:0 5px 0 var(--k3),0 10px 16px -6px var(--kg),inset 0 1.5px 0 rgb(255 255 255 / .45),inset 0 -2px 0 rgb(0 0 0 / .1);transition:transform .07s ease-out,box-shadow .07s ease-out}
.quick .qi::before{content:"";position:absolute;left:7px;right:7px;top:4px;height:42%;border-radius:13px 13px 22px 22px;background:linear-gradient(180deg,rgb(255 255 255 / .38),rgb(255 255 255 / 0));pointer-events:none}
.quick .qi svg{position:relative;width:27px;height:27px;stroke-width:2;filter:drop-shadow(0 1.5px 0 rgb(0 0 0 / .18))}
.quick .q1 .qi{--k1:#41c7d3;--k2:#11a6b5;--k3:#0a7c88;--kg:rgb(17 166 181 / .55);color:#fff;background:linear-gradient(180deg,var(--k1),var(--k2))}
.quick .q2 .qi{--k1:#ffa451;--k2:#f5821f;--k3:#bf5a06;--kg:rgb(245 130 31 / .55);color:#fff;background:linear-gradient(180deg,var(--k1),var(--k2))}
.quick .q3 .qi{--k1:#a3b0b8;--k2:#7f8d97;--k3:#5a6670;--kg:rgb(90 102 112 / .45);color:#fff;background:linear-gradient(180deg,var(--k1),var(--k2))}
.quick .q4 .qi{--k1:#3d464c;--k2:#1a2024;--k3:#000;--kg:rgb(0 0 0 / .4);color:#fff;background:linear-gradient(180deg,var(--k1),var(--k2))}
.quick button:active .qi,.quick button.press .qi{transform:translateY(4px);box-shadow:0 1px 0 var(--k3),0 3px 6px -3px var(--kg),inset 0 1.5px 0 rgb(255 255 255 / .3),inset 0 2px 6px rgb(0 0 0 / .18)}
.quick button:active,.quick button.press{color:var(--ink2)}
.quick button:focus-visible{outline:none}
.quick button:focus-visible .qi{outline:3px solid var(--teal);outline-offset:3px}

/* theme picker */
.hero{color:var(--on-main,#fff)}
.hero .minus,.hero .plus{color:var(--on-main,#fff)}
.btn.pri,.sheet > header .rr{color:var(--on-main,#fff)}
.thprev{margin:12px;border-radius:16px;padding:14px;background:var(--teal);color:var(--on-main,#fff);display:grid;gap:12px}
.thprev .t{font-family:var(--brand);font-size:18px}
.thprev .quick{pointer-events:none}
.thprev .quick button{color:var(--on-main,#fff)}
.thprev .quick .qi{width:50px;height:46px;border-radius:15px}
.thprev .quick .qi svg{width:22px;height:22px}
.sw8{display:flex;gap:8px;flex-wrap:wrap;padding:4px 14px 14px}
.sw8 button{width:32px;height:32px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgb(0 0 0 / .15)}
.sw8 button[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:2.5px}
.fr input[type=color]{flex:none;width:34px;height:34px;padding:0;border:0;border-radius:50%;overflow:hidden;cursor:pointer;background:none;-webkit-appearance:none;appearance:none}
.fr input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.fr input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.fr input[type=color]::-moz-color-swatch{border:0;border-radius:50%}
.fr .hx{flex:1;text-align:right;font-family:var(--num);font-size:13px;color:var(--ink3)}

/* allocation */
.tgl{position:relative;flex:none;width:46px;height:28px}
.tgl input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.tgl i{position:absolute;inset:0;border-radius:99px;background:#d6dcdf;transition:background .2s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:transform .2s}
.tgl input:checked + i{background:var(--teal)}
.tgl input:checked + i::after{transform:translateX(18px)}
.tgl input:disabled + i{opacity:.35}
.tgl input:focus-visible + i{outline:2px solid var(--teal);outline-offset:2px}
.fr.tg > span:first-child{min-width:0}
.fr.tg .nm{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr.tg b{font-family:var(--num);font-weight:700;white-space:nowrap}
.fr.tg b.off{color:var(--ink3);font-weight:500}
.fm{display:grid;gap:8px;padding:14px 12px 4px}
.fm .row1{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.fm .v{background:var(--soft);border-radius:11px;padding:5px 10px 6px;font-family:var(--num);font-weight:700;font-size:15px;text-align:center;line-height:1.25}
.fm .v small{display:block;font-size:10px;color:var(--ink2);font-weight:700;font-family:var(--font)}
.fm .op{font-family:var(--num);font-size:18px;font-weight:700;color:var(--ink3)}
.fm .v.hl{background:var(--teal);color:var(--on-main,#fff);font-size:17px;padding:6px 14px 7px}
.fm .v.hl small{color:inherit;opacity:.85}

/* bank: coin jar + repay tube + bags */
.bankrow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;align-items:end}
.jar,.tube{display:grid;justify-items:center;gap:4px;text-align:center}
.jarsvg{width:100%;max-width:300px;height:auto;overflow:visible}
.tubesvg{width:100%;height:auto}
.jl{display:grid;gap:0;line-height:1.3}
.jl b{font-size:20px}
.jar .jl b{font-size:24px;color:var(--teal-ink)}
.tube .jl b{color:var(--orange-ink);font-size:16px}
.jl span{font-size:11.5px;color:var(--ink2);font-family:var(--num)}
html.enter .cn{animation:cdrop .55s cubic-bezier(.3,1.35,.6,1) both}
@keyframes cdrop{from{transform:translateY(-150px)}}
.jarsvg .drop{animation:slot 4.5s ease-in infinite}
@keyframes slot{0%,55%{transform:translateY(-12px);opacity:0}60%{opacity:1}78%{transform:translateY(30px);opacity:1}82%,100%{transform:translateY(34px);opacity:0}}
.jarsvg .crown{animation:pop2 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pop2{to{transform:translateY(-3px) scale(1.06)}}
html.enter .tfill{animation:tup .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
@keyframes tup{from{transform:scaleY(0)}}
.tdrip{animation:drip 1.2s linear infinite}
@keyframes drip{from{transform:translateY(-6px);opacity:0}30%{opacity:1}to{transform:translateY(16px);opacity:0}}
.bags{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 8px}
.bags::-webkit-scrollbar{display:none}
.bag{flex:none;width:108px;display:grid;justify-items:center;gap:1px;padding:8px 6px 10px;border-radius:16px;background:#fff;text-align:center}
.bag svg{width:84px;height:88px;overflow:visible}
.bag .bagbody{transform-box:view-box;transform-origin:50% 100%;transition:transform .3s}
.bag.full svg{animation:sway 3s ease-in-out infinite;transform-origin:50% 95%}
.bag.full:nth-child(2n) svg{animation-delay:-1.4s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.bag:active svg{transform:scale(.92)}
.bag .bn{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bag .bs{font-size:10.5px;color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bag .ba{font-size:14px;font-weight:800;color:var(--orange-ink);margin-top:2px}
.bag.empty .ba{color:var(--ink3);font-weight:600;font-size:12px}
@media (prefers-reduced-motion:reduce){.jarsvg .drop{display:none}}

.wm.pt{font-size:23px;margin:0;font-weight:400;padding:0 4px 6px}
h2.cute{font-family:var(--brand);font-weight:400;font-size:18px;letter-spacing:.03em}

/* ---- intro animations before sheets ---- */
dialog[open]{animation:sheetIn .5s cubic-bezier(.2,1.12,.35,1)}
@keyframes sheetIn{from{transform:translateY(55%)}}
dialog[open]::backdrop{animation:bdin .3s ease-out}
@keyframes bdin{from{opacity:0}}
.intro{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgb(255 255 255 / .84);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:ifade .16s ease-out}
.intro.out{animation:iout .28s ease-in forwards}
@keyframes ifade{from{opacity:0}}
@keyframes iout{to{opacity:0;transform:scale(1.18)}}
.intro .stage{width:230px;display:grid;justify-items:center;gap:6px}
.intro svg{width:210px;height:210px;overflow:visible}
.intro .cap{font-family:var(--brand);font-size:20px;color:var(--ink);animation:capin .5s .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes capin{from{transform:scale(.4);opacity:0}}
.bin{animation:bin .32s cubic-bezier(.3,1.6,.5,1) both;transform-box:view-box;transform-origin:100px 130px}
@keyframes bin{from{transform:scale(.45)}}
/* box */
.ix-box .fl{transform-box:view-box;animation:flapL .38s .28s cubic-bezier(.3,1.5,.5,1) both}
.ix-box .fl.l{transform-origin:48px 93px}
.ix-box .fl.r{transform-origin:152px 93px;animation-name:flapR}
@keyframes flapL{to{transform:rotate(-158deg)}}
@keyframes flapR{to{transform:rotate(158deg)}}
.ix-box .pop{animation:popup .5s .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popup{from{transform:translateY(50px) scale(.6)}to{transform:translateY(-58px) scale(1.25)}}
.ix .sparks{transform-box:view-box;transform-origin:100px 52px;opacity:0;animation:spark .5s .85s ease-out both}
@keyframes spark{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.5)}}
/* kuji */
.kj{perspective:700px;width:210px;height:210px;display:grid;place-items:center;position:relative}
.kj .rays{position:absolute;width:260px;height:260px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgb(245 130 31 / .28) 0 10deg,transparent 10deg 22deg);opacity:0;animation:rays 1.4s .75s linear both}
@keyframes rays{0%{opacity:0;transform:scale(.6) rotate(0)}20%{opacity:1}100%{opacity:1;transform:scale(1) rotate(60deg)}}
.kj .tk{width:132px;height:176px;position:relative;animation:bin .32s cubic-bezier(.3,1.6,.5,1) both;transform-style:preserve-3d}
.kj .tk > div{position:absolute;inset:0;border-radius:14px;border:3.5px solid #0d2c33}
.kj .under{background:#fff;display:grid;place-content:center;justify-items:center;gap:2px}
.kj .pz{font:900 48px/1 var(--num);color:var(--orange)}
.kj .pz.last{font-size:34px}
.kj .sub{font-family:var(--brand);font-size:15px;color:var(--ink)}
.kj .cover{background:repeating-linear-gradient(135deg,var(--teal) 0 11px,var(--teal-d) 11px 22px);display:grid;place-items:center;color:#fff;font-family:var(--brand);font-size:28px;transform-origin:0 0;backface-visibility:hidden;animation:peel .62s .38s cubic-bezier(.55,0,.3,1) both;box-shadow:4px 6px 0 rgb(0 0 0 / .12)}
.kj .cover b{background:rgb(255 255 255 / .92);color:var(--teal-ink);border-radius:10px;padding:4px 12px;font-weight:400}
@keyframes peel{0%{transform:none}25%{transform:rotate3d(-1,1,0,-14deg)}100%{transform:rotate3d(-1,1,0,-178deg)}}
/* capsule */
.ix-cap .whole{transform-box:view-box;transform-origin:100px 104px;animation:shake .42s .1s ease-in-out both}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.ix-cap .top{transform-box:view-box;transform-origin:100px 100px;animation:capTop .45s .55s cubic-bezier(.3,1.3,.5,1) both}
@keyframes capTop{to{transform:translate(-34px,-58px) rotate(-38deg)}}
.ix-cap .bot{animation:capBot .45s .55s cubic-bezier(.3,1.3,.5,1) both}
@keyframes capBot{to{transform:translate(14px,26px) rotate(8deg)}}
.ix-cap .bot{transform-box:view-box;transform-origin:100px 100px}
.ix-cap .prize{transform-box:view-box;transform-origin:100px 96px;animation:prize .5s .62s cubic-bezier(.3,1.7,.5,1) both}
@keyframes prize{from{transform:scale(0)}to{transform:translateY(-10px) scale(1)}}
/* receipt */
.ix-rc .paper{animation:print .62s .22s steps(7,end) both}
@keyframes print{from{transform:translateY(-118px)}}
.ix-rc .led{animation:led .2s .2s steps(2) 5}
@keyframes led{50%{fill:#ffc531}}
/* calc */
.ix-calc .k{transition:none}
.ix-calc .k1{animation:key .18s .2s ease both}.ix-calc .k2{animation:key .18s .42s ease both}.ix-calc .k3{animation:key .18s .64s ease both}
@keyframes key{50%{fill:var(--orange);transform:translateY(2px)}}
.ix-calc .d{opacity:0}
.ix-calc .d0{animation:dshow .22s 0s both}.ix-calc .d1{animation:dshow .22s .25s both}.ix-calc .d2{animation:dshow .22s .47s both}.ix-calc .d3{animation:dfinal .4s .7s both}
@keyframes dshow{0%,99%{opacity:1}100%{opacity:0}}
@keyframes dfinal{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.ix-calc .d3{transform-box:fill-box}

/* object buttons */
.quick .qi,.quick .q1 .qi,.quick .q2 .qi,.quick .q3 .qi,.quick .q4 .qi{width:70px;height:64px;border-radius:0;background:none;box-shadow:none;transition:none}
.quick .qi::before{display:none}
.quick .qi svg.obj{width:70px;height:66px;overflow:visible;filter:none;stroke-width:initial}
.obj .ob{transform-box:view-box;transform-origin:32px 56px;animation:float 3.4s ease-in-out infinite;transition:transform .09s ease-out}
.obj .gs{transform-box:view-box;transform-origin:32px 58.5px;animation:gsh 3.4s ease-in-out infinite}
.quick .q2 .obj .ob,.quick .q2 .obj .gs{animation-delay:-.85s}
.quick .q3 .obj .ob,.quick .q3 .obj .gs{animation-delay:-1.7s}
.quick .q4 .obj .ob,.quick .q4 .obj .gs{animation-delay:-2.55s}
@keyframes float{50%{transform:translateY(-3.5px)}}
@keyframes gsh{50%{transform:scaleX(.82);opacity:.08}}
.quick button:active .qi,.quick button.press .qi{transform:none;box-shadow:none}
.quick button.press .obj .ob{animation:none;transform:translateY(4px) scale(1.1,.86)}
.quick button.press .obj .gs{animation:none;transform:scaleX(1.12)}
.quick button.boing .obj .ob{animation:boing .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:translateY(4px) scale(1.1,.86)}45%{transform:translateY(-7px) scale(.94,1.08)}100%{transform:none}}
.thprev .quick .qi,.thprev .quick .qi svg.obj{width:54px;height:52px}

/* in-button animation */
.quick .qi{position:relative}
.quick .qi.playing svg.obj{opacity:0}
.inbtn{position:absolute;left:50%;top:50%;width:210px;height:210px;transform:translate(-50%,-54%) scale(.42);pointer-events:none;z-index:2;display:grid;place-items:center}
.inbtn > svg{width:210px;height:210px;overflow:visible}
.bub{position:absolute;left:50%;top:calc(100% + 30px);transform:translateX(-50%);white-space:nowrap;font-family:var(--brand);font-size:12px;background:var(--ink);color:#fff;padding:3px 10px;border-radius:99px;z-index:3;animation:bub .55s .3s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none}
.bub::after{content:"";position:absolute;left:50%;bottom:100%;margin-left:-4px;border:4px solid transparent;border-bottom-color:var(--ink)}
@keyframes bub{from{transform:translateX(-50%) translateY(6px) scale(.3);opacity:0}}
/* ---- crafted forms ---- */
.sheet{grid-template-rows:auto minmax(0,1fr) auto}
.sheet .body{gap:12px;padding-top:6px}
.sfoot{display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgb(255 255 255 / .97);border-top:.5px solid var(--line)}
.sfoot .btn.pri{flex:1;min-height:52px;font-size:16px;border-radius:15px}
.fsum{display:grid;line-height:1.15;min-width:100px}
.fsum span{font-size:11px;color:var(--ink2);font-weight:700}
.fsum b{font:700 21px var(--num);white-space:nowrap}
.fs{background:#fff;border-radius:20px;padding:16px;display:grid;gap:16px}
.fs[hidden]{display:none}
.fsh{display:flex;align-items:center;gap:10px;margin-bottom:-2px}
.fsi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.fsi svg{width:20px;height:20px}
.fsi.teal{background:var(--teal-bg);color:var(--teal-ink)} .fsi.orange{background:var(--orange-bg);color:var(--orange-ink)} .fsi.ink{background:var(--ink);color:#fff} .fsi.soft{background:var(--soft);color:var(--ink2)}
.fsh b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.fsh small{display:block;font-size:12px;color:var(--ink2);line-height:1.4}
.lbl{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.mf{display:grid;gap:3px;min-width:0}
.mi{display:flex;align-items:baseline;gap:5px;border-bottom:2px solid var(--line);padding:0 2px 6px;transition:border-color .2s}
.mi:focus-within{border-color:var(--teal)}
.mi i{font-style:normal;font:700 20px var(--num);color:var(--ink3);flex:none}
.mi input{border:0;background:none;font:700 28px var(--num);width:100%;min-width:0;color:var(--ink);padding:2px 0;-webkit-appearance:none;appearance:none}
.mi input:focus{outline:none}
.mi input::placeholder{color:#c4ccd0;font-weight:600;font-size:17px}
.mf.sm .mi input{font-size:20px}
.mf.sm .mi i{font-size:15px}
.cf{display:grid;gap:7px}
.cg{display:flex;flex-wrap:wrap;gap:6px}
.cg button{font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:12px;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;gap:6px;min-height:38px;transition:transform .12s,background .15s}
.cg button:active{transform:scale(.95)}
.cg button small{font-size:11px;color:var(--ink2);font-family:var(--num);font-weight:700}
.cg button[aria-checked="true"]{background:var(--ink);color:#fff}
.cg button[aria-checked="true"] small{color:rgb(255 255 255 / .7)}
.df{display:grid;gap:7px}
.dq{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dq button{font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:12px;background:var(--soft);min-height:38px}
.dq button[aria-pressed="true"]{background:var(--teal-bg);color:var(--teal-ink);box-shadow:inset 0 0 0 1.5px var(--teal)}
.dq input[type=date]{border:0;background:var(--soft);border-radius:12px;padding:8px 10px;font:inherit;font-size:15px;min-height:38px;color:var(--ink);-webkit-appearance:none;appearance:none;flex:1;min-width:130px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.two .df .dq button{display:none}
.mrow{display:flex;align-items:flex-end;gap:10px}
.mrow .mf{flex:1}
.mrow .mini-btn{margin-bottom:8px}
.nm-row{display:flex;gap:14px;align-items:center}
.nm-in{flex:1;min-width:0}
.big-in{border:0;background:none;font-size:20px;font-weight:800;width:100%;padding:4px 0 6px;border-bottom:2px solid var(--line);color:var(--ink);border-radius:0}
.big-in:focus{outline:none;border-color:var(--teal)}
.big-in::placeholder{color:#c4ccd0}
.nm-sub{display:flex;gap:8px;margin-top:10px;align-items:center}
.mini-in{flex:1;min-width:0;border:0;background:var(--soft);border-radius:11px;padding:8px 11px;font-size:16px;color:var(--ink);width:100%}
.mini-in:focus{outline:2px solid var(--teal);outline-offset:0}
.pick-in{position:relative;flex:1;min-width:0}
.pick-in select{width:100%;border:0;background:var(--soft);border-radius:11px;padding:8px 28px 8px 11px;font-size:16px;-webkit-appearance:none;appearance:none;color:var(--ink2)}
.pick-in::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.stg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stg button{display:grid;justify-items:center;gap:5px;padding:11px 2px 9px;border-radius:15px;background:var(--soft);font-size:11px;font-weight:700;color:var(--ink2);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .15s}
.stg svg{width:22px;height:22px}
.stg button[aria-pressed="true"]{transform:translateY(-3px);color:#fff}
.stg button[aria-pressed="true"][data-v="stock"]{background:var(--ink)}
.stg button[aria-pressed="true"][data-v="listed"]{background:var(--teal);color:var(--on-main,#fff)}
.stg button[aria-pressed="true"][data-v="shipping"],.stg button[aria-pressed="true"][data-v="sold"]{background:var(--orange)}
.stg button[aria-pressed="true"][data-v="kept"]{background:var(--exp)}
.hintcard{margin:0;font-size:12.5px;color:var(--ink2);background:#fff;border:1.5px dashed #d6dde0;border-radius:16px;padding:11px 14px;line-height:1.5}
.tgrow{display:flex;align-items:center;gap:10px;font-size:14px;min-height:40px}
.tgrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.tgrow b{font-family:var(--num);font-weight:700;white-space:nowrap}
.tgrow b.off{color:var(--ink3);font-weight:500}
.tglist{display:grid}
.tglist .tgrow + .tgrow{border-top:.5px solid var(--line)}
.ta{width:100%;border:0;background:var(--soft);border-radius:13px;padding:11px 12px;font:inherit;font-size:16px;resize:vertical;color:var(--ink);min-height:70px}
.ta:focus{outline:2px solid var(--teal)}
.stepper{display:flex;align-items:center;gap:6px;padding-bottom:4px}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--soft);font:700 20px var(--num);color:var(--ink);flex:none}
.stepper button:active{transform:scale(.9)}
.stepper input{width:100%;min-width:0;text-align:center;font:700 24px var(--num);border:0;border-bottom:2px solid var(--line);background:none;padding:2px 0;color:var(--ink);-webkit-appearance:none;appearance:none}
.stepper input:focus{outline:none;border-color:var(--teal)}
.quick-n button,.quick-p button,.pzq button{font-family:var(--num)}
.pzq button{background:var(--orange-bg);color:var(--orange-ink);font-weight:800}
.pzq button[data-pz="×"]{background:var(--soft);color:var(--ink2)}
.photo{position:relative;width:96px;height:96px;border-radius:20px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none;cursor:pointer;color:var(--ink3)}
.photo > svg{width:32px;height:32px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .cam{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--teal-ink);box-shadow:0 1px 4px rgb(0 0 0 / .15);z-index:1}
.photo .cam svg{width:15px;height:15px}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2;width:100%;height:100%}
.photo:focus-within{outline:2px solid var(--teal);outline-offset:2px}
.amtcard{justify-items:center;padding:20px 16px 18px;gap:12px}
.bigamt{display:flex;justify-content:center;align-items:baseline;gap:6px;width:100%}
.bigamt i{font-style:normal;font:700 28px var(--num);color:var(--ink3)}
.bigamt input{font:700 46px var(--num);width:100%;max-width:240px;text-align:center;border:0;background:none;color:var(--ink);-webkit-appearance:none;appearance:none;border-bottom:2.5px solid var(--line);padding:0 0 4px}
.bigamt input:focus{outline:none;border-color:var(--teal)}
.bigamt input.bump{animation:bumpn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes bumpn{50%{transform:scale(1.08)}}
.qadd{justify-content:center}

function celebrate(msg,coinsOnly){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div");t.className="toast big";t.textContent=msg;t.setAttribute("role","status");document.body.appendChild(t);setTimeout(()=>t.remove(),2600);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.className="fx";document.body.appendChild(c);
  const dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  const P=Array.from({length:38},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*2.4,vy:2+Math.random()*3,r:7+Math.random()*6,a:Math.random()*6.28,va:(Math.random()-.5)*.2,coin:coinsOnly||Math.random()<.35,col:pick(CAPS)}));
  const t0=performance.now();
  (function f(now){const el=now-t0;x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.18;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.lineWidth=2;x.strokeStyle=INK;
      if(p.coin){x.fillStyle="#ffc531";x.beginPath();x.arc(0,0,p.r,0,7);x.fill();x.stroke();x.fillStyle=INK;x.font=`800 ${p.r*1.2}px sans-serif`;x.textAlign="center";x.textBaseline="middle";x.fillText("¥",0,1)}
      else{x.fillStyle="#fff";x.beginPath();x.arc(0,0,p.r,0,7);x.fill();x.stroke();x.fillStyle=p.col;x.beginPath();x.arc(0,0,p.r,Math.PI,0);x.closePath();x.fill();x.stroke()}
      x.restore()});
    if(el<1900)requestAnimationFrame(f);else c.remove()})(t0);
}

function keptCalc(tid,over){
  const t=S.titles[tid];if(!t)return null;
  let its=Object.values(S.items).filter(i=>i.titleId===tid);
  if(over){its=its.filter(i=>i.id!==over.id);if(over.titleId===tid)its.push(over)}
  const M=allocMap(its,S.titles),C=cfg();let cost=n(t.bulkCost),net=0;
  its.forEach(i=>{if(has(i.cost))cost+=+i.cost;if(SOLD(i.status))net+=calcItem(i,M.A[i.id]||0,C).net});
  const kept=its.filter(i=>i.status==="kept"),tg=(M.grp[tid]||[]).length,nk=kept.filter(i=>!has(i.cost)).length;
  const unit=has(t.bulkCost)&&(tg+nk)?n(t.bulkCost)/(tg+nk):0;
  const base={};kept.forEach(i=>{base[i.id]=has(i.cost)?+i.cost:unit});
  const sb=Object.values(base).reduce((a,b)=>a+b,0),remaining=Math.max(0,cost-net),k=sb?Math.min(1,remaining/sb):0;
  const E={};kept.forEach(i=>{E[i.id]={unit:base[i.id],eff:Math.round(base[i.id]*k)}});
  return {t,kept,unit,remaining,E,cost,net,paid:cost>0&&remaining<=0,recov:cost?Math.min(1,net/cost):0,effSum:Math.round(sb*k),baseSum:sb};

/* calculations */
/* くじ・ガチャの仕入れ値を「売るもの」だけで割る */
const isTarget=(i,T)=>{const t=T[i.titleId];return !!(t&&has(t.bulkCost)&&!has(i.cost)&&i.status!=="kept"&&!i.noAlloc)};
function allocMap(items,T){
  const grp={},A={},mode={};
  items.forEach(i=>{if(isTarget(i,T))(grp[i.titleId]=grp[i.titleId]||[]).push(i)});
  Object.entries(grp).forEach(([tid,arr])=>{const t=T[tid],bulk=+t.bulkCost,ws=arr.map(i=>n(i.salePrice)||n(i.listPrice)),sw=ws.reduce((a,b)=>a+b,0);
    const byPrice=t.allocMode==="price"&&ws.every(w=>w>0);mode[tid]=byPrice?"price":"equal";
    arr.forEach((i,k)=>{A[i.id]=byPrice?bulk*ws[k]/sw:bulk/arr.length})});
  items.forEach(i=>{if(!(i.id in A))A[i.id]=has(i.cost)?+i.cost:0});
  return {A,grp,mode};
}
function derive(){
  const C=cfg(),items=Object.values(S.items),T=S.titles,R={},unalloc={};
  const {A,grp,mode}=allocMap(items,T);
  items.forEach(i=>{R[i.id]=calcItem(i,A[i.id],C)});
  Object.values(T).forEach(t=>{if(has(t.bulkCost)&&!grp[t.id])unalloc[t.id]=+t.bulkCost});
  return {R,unalloc,grp,mode};
}
function calcItem(i,alloc,C){
  C=C||cfg();
  const rate=has(i.feeRate)?+i.feeRate:C.defaultRate,sold=SOLD(i.status);
  const sale=sold?n(i.salePrice):0,fee=sold?(has(i.feeAmount)?+i.feeAmount:Math.floor(sale*rate/100)):0,ship=sold?n(i.shipCost):0,net=sale-fee-ship;
  const profit=sold?net-alloc:i.status==="kept"?-alloc:null;
  let expNet=null,expected=null;
  if((i.status==="stock"||i.status==="listed")&&has(i.listPrice)){expNet=+i.listPrice-Math.floor(+i.listPrice*rate/100)-n(i.shipCost);expected=expNet-alloc}
  const start=i.pDate;
  const age=(i.status==="stock"||i.status==="listed")?days(start,TD):null;
  const sellDays=sold&&i.sDate?days(start,i.sDate):null;
  return {alloc,rate,sale,fee,ship,net,profit,margin:sold&&sale?profit/sale:null,recov:sold&&alloc?net/alloc:null,expNet,expected,age,sellDays};
}
const isStale=(i,r,C)=>i.status==="stock"&&r.age!=null&&r.age>=(C||cfg()).staleDays;
function splitPays(rec,total,draws){
  total=n(total);draws=n(draws);const main={card:rec.card||"未設定",buyer:rec.buyer||"未設定"};
  const ps=(rec.pays||[]).filter(p=>p&&(+p.draws>0||+p.amount>0));
  if(!ps.length||!total)return [Object.assign({amount:total,draws},main)];
  let amt=0,used=0;const out=ps.map(p=>{const a=+p.amount>0?Math.round(+p.amount):(draws?Math.round(total*p.draws/draws):0);amt+=a;used+=+p.draws||0;return {card:p.card||main.card,buyer:p.buyer||main.buyer,amount:a,draws:+p.draws||0}});
  if(total-amt>0){const m=out.find(o=>o.card===main.card&&o.buyer===main.buyer);if(m){m.amount+=total-amt;m.draws+=Math.max(0,draws-used)}else out.push(Object.assign({amount:total-amt,draws:Math.max(0,draws-used)},main))}
  return out;
}
const titlePays=t=>splitPays(t,t.bulkCost,t.draws);
const paysText=(t,ps)=>{ps=ps||titlePays(t);return ps.length>1?ps.map(p=>`${p.card}${p.draws?p.draws+"回":"¥"+p.amount.toLocaleString("ja-JP")}${new Set(ps.map(x=>x.buyer)).size>1?"("+p.buyer+")":""}`).join("・"):""};
function purchases(withExp){
  const out=[];
  Object.values(S.items).forEach(i=>{if(has(i.cost)&&+i.cost)splitPays(i,i.cost,0).forEach(p=>{if(p.amount)out.push({date:i.pDate||"",card:p.card,buyer:p.buyer,amount:p.amount,label:(i.prize?i.prize+" ":"")+i.name,kind:"仕入"})})});
  Object.values(S.titles).forEach(t=>{if(has(t.bulkCost)&&+t.bulkCost){const ps=titlePays(t);ps.forEach(p=>{if(p.amount)out.push({date:t.pDate||"",card:p.card,buyer:p.buyer,amount:p.amount,label:t.name+(ps.length>1&&p.draws?`（${p.draws}回分）`:""),kind:"仕入"})})}});
  if(withExp)Object.values(S.exps).forEach(e=>splitPays(e,e.amount,0).forEach(p=>out.push({date:e.date||"",card:p.card,buyer:p.buyer,amount:p.amount,label:e.cat+(e.note?"・"+e.note:""),kind:"経費"})));
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

function monthStats(D,key){

/* 貯金箱：コインの山と簡単な物理演算 */
function initJar(drop){
  const box=document.querySelector(".jarbox");if(!box)return;
  const cv=box.querySelector("canvas"),rc=box.getBoundingClientRect();if(!rc.width)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),k=rc.width/200;
  cv.width=Math.round(rc.width*dpr);cv.height=Math.round(rc.height*dpr);
  const ctx=cv.getContext("2d");ctx.setTransform(dpr*k,0,0,dpr*k,0,0);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pct=Math.min(1,+box.dataset.pct||0),MAXC=150,N=Math.round(pct*MAXC);
  const FLOOR=197,TH=3.4,R=10.5,RY=4,G=1500,NS=9;
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const st=[];for(let i=0;i<NS;i++){st.push({x:28+i*18,n:0,w:.55+.45*Math.sin(Math.PI*(i+.5)/NS)+rnd()*.25,jx:[]})}
  const sw=st.reduce((a,b)=>a+b.w,0);let left=N;
  st.forEach(s=>{s.n=Math.floor(N*s.w/sw);left-=s.n});
  st.slice().sort((a,b)=>b.w-a.w).forEach(s=>{if(left>0){s.n++;left--}});
  st.forEach(s=>{for(let j=0;j<60;j++)s.jx.push((rnd()-.5)*2.6)});
  const coins=[];const queue=[];
  if(drop&&!reduce&&N>0){const kd=Math.min(6,N);for(let j=0;j<kd;j++){const s=st.slice().sort((a,b)=>b.n-a.n)[j%3];s.n--;queue.push({t:.15+j*.32,target:st.indexOf(s),amb:false})}}
  const topY=i=>FLOOR-st[i].n*TH;
  const surf=(c)=>{if(c.target!=null&&Math.abs(c.x-st[c.target].x)<R*1.1)return topY(c.target);let y=FLOOR;st.forEach((s,i)=>{if(Math.abs(c.x-s.x)<R*.9)y=Math.min(y,topY(i))});return y};
  function coin(x,y,ry,a,rot){
    ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.rotate(rot||0);
    const th=TH*Math.min(1,ry/RY*.9+.1);
    const sg=ctx.createLinearGradient(-R,0,R,0);sg.addColorStop(0,"#9c6a00");sg.addColorStop(.35,"#e2a300");sg.addColorStop(.6,"#f3c23a");sg.addColorStop(1,"#8f5f00");
    ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(0,th,R,ry,0,0,Math.PI);ctx.lineTo(-R,0);ctx.ellipse(0,0,R,ry,0,Math.PI,0,true);ctx.closePath();ctx.fill();
    ctx.strokeStyle="rgba(110,70,0,.55)";ctx.lineWidth=.5;for(let q=-R+2;q<R-1;q+=2.4){const yy=ry*Math.sqrt(Math.max(0,1-(q/R)**2));ctx.beginPath();ctx.moveTo(q,yy+.3);ctx.lineTo(q,yy+th-.3);ctx.stroke()}
    const tg=ctx.createRadialGradient(-R*.3,-ry*.4,1,0,0,R);tg.addColorStop(0,"#fff3b0");tg.addColorStop(.45,"#ffd34d");tg.addColorStop(1,"#e8a400");
    ctx.fillStyle=tg;ctx.beginPath();ctx.ellipse(0,0,R,ry,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#8a5a00";ctx.lineWidth=.8;ctx.stroke();
    ctx.strokeStyle="rgba(150,95,0,.55)";ctx.lineWidth=.7;ctx.beginPath();ctx.ellipse(0,0,R*.7,ry*.7,0,0,Math.PI*2);ctx.stroke();
    if(ry>R*.55){ctx.fillStyle="rgba(140,90,0,.7)";ctx.font=`900 ${R*.95}px ui-rounded,sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("¥",0,.5)}
    ctx.restore();
  }
  function draw(){
    ctx.clearRect(-10,-10,230,230);
    st.forEach(s=>{for(let j=0;j<s.n;j++)coin(s.x+s.jx[j%60],FLOOR-(j+1)*TH,RY,1,0)});
    coins.forEach(c=>{let ry,rot=0;if(c.s==="fall"){ry=Math.max(R*.14,R*Math.abs(Math.cos(c.phi)))}else{const e=Math.min(1,c.t);ry=c.ry0+(RY-c.ry0)*e;rot=Math.sin(e*Math.PI)*c.tw*(1-e*.4)}coin(c.x,c.y-TH,ry,c.a,rot)});
  }
  let last=performance.now(),t0=last,nextAmb=t0+3500+Math.random()*2500;
  function spawn(target,amb){coins.push({x:100+(Math.random()-.5)*3,y:30,vx:0,vy:40,phi:Math.random()*3,spin:9+Math.random()*5,target,amb,s:"fall",b:0,a:1,t:0})}
  function frame(now){
    if(!box.isConnected)return;
    const dt=Math.min(.033,(now-last)/1000);last=now;const el=(now-t0)/1000;
    while(queue.length&&queue[0].t<=el){const q=queue.shift();spawn(q.target,q.amb)}
    if(!reduce&&N>0&&now>nextAmb&&!coins.some(c=>c.amb)){spawn(Math.floor(Math.random()*NS),true);nextAmb=now+6500+Math.random()*3500}
    for(let i=coins.length-1;i>=0;i--){const c=coins[i];
      if(c.s==="fall"){c.vy+=G*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.phi+=c.spin*dt;
        if(c.x<20+R){c.x=20+R;c.vx=Math.abs(c.vx)*.5}if(c.x>180-R){c.x=180-R;c.vx=-Math.abs(c.vx)*.5}
        const sy=surf(c);
        if(c.y>60&&c.y>=sy){c.y=sy;
          if(c.vy>150&&c.b<3){c.vy=-c.vy*(.32-c.b*.06);c.b++;c.spin*=.55;c.vx=(Math.random()-.5)*70+(c.target!=null?(st[c.target].x-c.x)*2.2:0)}
          else{c.s="tip";c.t=0;c.ry0=Math.max(R*.14,R*Math.abs(Math.cos(c.phi)));c.tw=(Math.random()<.5?-1:1)*(.35+Math.random()*.25);c.x0=c.x}}}
      else if(c.s==="tip"){c.t+=dt/.26;if(c.target!=null){const tx=st[c.target].x;c.x=c.x0+(tx-c.x0)*Math.min(1,c.t)}c.y=surf(c);
        if(c.t>=1){if(!c.amb&&c.target!=null){st[c.target].n++;coins.splice(i,1);continue}c.s="rest";c.rt=0}}
      else if(c.s==="rest"){c.rt+=dt;if(c.rt>2.2){c.a-=dt*2;if(c.a<=0)coins.splice(i,1)}}
    }
    draw();requestAnimationFrame(frame);
  }
  draw();
  if(!reduce)requestAnimationFrame(frame);
}

function filteredItems(D,C){
  const f=S.f;let items=Object.values(S.items);const q=f.q.trim().toLowerCase();
  if(q)items=items.filter(i=>[i.name,i.prize,i.note,i.cat2,S.titles[i.titleId]?.name].join(" ").toLowerCase().includes(q));
  if(f.status==="stale")items=items.filter(i=>isStale(i,D.R[i.id],C));else if(f.status)items=items.filter(i=>i.status===f.status);
  if(f.cat)items=items.filter(i=>i.cat1===f.cat);
  if(f.title)items=items.filter(i=>(i.titleId||"")===(f.title==="_none"?"":f.title));
  const sorter={new:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),age:(a,b)=>(D.R[b.id].age??-1)-(D.R[a.id].age??-1),profit:(a,b)=>(D.R[b.id].profit??D.R[b.id].expected??-1e9)-(D.R[a.id].profit??D.R[a.id].expected??-1e9),price:(a,b)=>(n(b.salePrice)||n(b.listPrice))-(n(a.salePrice)||n(a.listPrice))}[f.sort]||((a,b)=>0);
  return items.sort(sorter);
}

function titleStats(t,D){
  const its=Object.values(S.items).filter(i=>i.titleId===t.id);
  let cost=n(t.bulkCost),net=0,expNet=0,sold=0,sales=0;
  its.forEach(i=>{const r=D.R[i.id];if(has(i.cost))cost+=+i.cost;if(SOLD(i.status)){net+=r.net;sales+=r.sale;sold++}if(r.expNet!=null)expNet+=r.expNet});
  const tg=(D.grp&&D.grp[t.id])||[];
  return {its,cost,net,bal:net-cost,recov:cost?net/cost:null,proj:net+expNet-cost,sold,sales,tg:tg.length,per:tg.length&&D.mode[t.id]==="equal"?n(t.bulkCost)/tg.length:null};
}
